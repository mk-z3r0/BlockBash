<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Block Bash</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg-deep: #0a0d1c;
    --bg-panel: #0f1428;
    --line: #1e2a4a;
    --square: #f2c14e;
    --square-dark: #c99a2e;
    --sphere: #ff4d8d;
    --sphere-dark: #a12d5c;
    --coin: #5ee7ff;
    --check: #8effc0;
    --text: #e8ecf7;
    --text-dim: #7a84a8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 20% 10%, #29345b 0%, transparent 55%), radial-gradient(ellipse at 85% 85%, #40233d 0%, transparent 50%), #080d1b;
    padding: 24px 12px;
    font-family: 'Trebuchet MS', 'Segoe UI', Arial, sans-serif;
    color: var(--text);
  }

  .frame {
    position: relative;
    /* border-box is global, so this has to include the padding below —
       otherwise the frame ends up narrower than the 800px canvas inside it */
    width: min(100%, 840px);
    padding: 18px;
    background: var(--bg-panel);
    border: 2px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 24px 80px #0008, 0 0 0 6px #ffffff03;
  }

  h1 {
    margin: 0 0 4px 0;
    font-size: 34px;
    letter-spacing: 4px;
    font-weight: 900;
    text-align: center;
  }
  h1 .b1 { color: var(--square); }
  h1 .b2 { color: var(--sphere); }

  .tagline {
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    margin: 0 0 14px 0;
    letter-spacing: 1px;
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 8px;
    background: #10162c;
    border: 3px solid var(--line);
  }

  .controls {
    display: flex;
    /* a fixed width, not just flex-wrap, so wrapping has an unambiguous
       boundary to wrap against — .frame is a shrink-to-fit flex child of
       body (align-items:center), so its width chain doesn't reliably
       constrain this without something concrete to anchor to */
    width: 100%;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 6px 16px;
    color: var(--text-dim);
    font-size: 12px;
    margin-top: 10px;
    letter-spacing: 0.5px;
  }
  .controls span { background: #1b2540; padding: 7px 9px; border-radius: 5px; color: #b6c6e8; }
  @media (max-width: 600px) { .frame { padding: 8px; } h1 { font-size: 25px; } .controls { justify-content: center; } }
</style>
</head>
<body>

<div class="frame">
  <h1><span class="b1">BLOCK</span> <span class="b2">BASH</span></h1>
  <p class="tagline">the squares defend their corners</p>
  <canvas id="game" width="800" height="450"></canvas>
  <div class="controls">
    <span>&larr; &rarr; / A D — move</span>
    <span>SPACE / &uarr; / W — jump</span>
    <span>SHIFT / B — run + weapon</span>

    <span>ESC — pause</span>
    <span>M — mute</span>

  </div>
  <p class="tagline" style="margin-top:6px;">Xbox controller: A / Y run + weapon &middot; B jump &middot; Start pause</p>
<p class="tagline" style="margin:10px 0 0;color:#b6c6e8">Hold to run + swing. With triangles: tap to shoot, hold to run.</p>
</div>

<script type="module" src="src/main.js"></script>

</body>
</html>
