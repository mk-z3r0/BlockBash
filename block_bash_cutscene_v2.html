<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Block Bash</title>
<style>
  :root {
    --bg-deep: #0a0d1c;
    --bg-panel: #0f1428;
    --line: #1e2a4a;
    --square: #f2c14e;
    --square-dark: #c99a2e;
    --sphere: #ff4d8d;
    --sphere-dark: #a12d5c;
    --coin: #5ee7ff;
    --check: #8effc0;
    --text: #e8ecf7;
    --text-dim: #7a84a8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--bg-deep) 0%, #060810 100%);
    font-family: 'Trebuchet MS', 'Segoe UI', Arial, sans-serif;
    color: var(--text);
  }

  .frame {
    position: relative;
    padding: 18px;
    background: var(--bg-panel);
    border: 2px solid var(--line);
    clip-path: polygon(0 12px, 12px 0, calc(100% - 12px) 0, 100% 12px, 100% calc(100% - 12px), calc(100% - 12px) 100%, 12px 100%, 0 calc(100% - 12px));
  }

  h1 {
    margin: 0 0 4px 0;
    font-size: 34px;
    letter-spacing: 4px;
    font-weight: 900;
    text-align: center;
  }
  h1 .b1 { color: var(--square); }
  h1 .b2 { color: var(--sphere); }

  .tagline {
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    margin: 0 0 14px 0;
    letter-spacing: 1px;
  }

  canvas {
    display: block;
    background: #10162c;
    border: 3px solid var(--line);
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 6px 16px;
    color: var(--text-dim);
    font-size: 12px;
    margin-top: 10px;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<div class="frame">
  <h1><span class="b1">BLOCK</span> <span class="b2">BASH</span></h1>
  <p class="tagline">the squares defend their corners</p>
  <canvas id="game" width="800" height="450"></canvas>
  <div class="controls">
    <span>&larr; &rarr; / A D — move</span>
    <span>SPACE / &uarr; / W — jump</span>
    <span>B — bazooka</span>
    <span>M — mute</span>
    <span>R — restart</span>
  </div>
</div>

<script>
// ============================================
// SETUP
// ============================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const VIEW_WIDTH = canvas.width;
const VIEW_HEIGHT = canvas.height;

// ============================================
// WORLD SETTINGS
// ============================================
const GRAVITY_UP = 0.42;     // gravity while rising — lighter, floatier arc up
const GRAVITY_DOWN = 0.68;   // gravity while falling — a bit snappier than rising, not jarring
const ACCEL = 0.35;          // how fast the player speeds up — gentler ramp, less "instant" feel
const FRICTION = 0.9;        // how fast the player slows down when no key is held
const TURN_ACCEL = 0.5;      // extra deceleration applied when reversing direction
const MAX_SPEED = 3.6;       // top horizontal speed — slower overall pace
const JUMP_FORCE = -11;
const JUMP_CUT_MULTIPLIER = 0.6; // releasing jump early cuts upward velocity, enabling short hops
const COYOTE_FRAMES = 9;     // grace window to still jump just after walking off a ledge
const JUMP_BUFFER_FRAMES = 6; // grace window: a jump press just before landing still fires
const STOMP_BOUNCE = -8;
const WORLD_WIDTH = 3200;
const GROUND_Y = 410;
const BAZOOKA_COOLDOWN = 60; // 1 second between shots
const MISSILE_SPEED = 11;
const MISSILE_RANGE = 320;  // missiles fizzle out after this many pixels

// --- The final sphere: a chainsaw-wielding boss guarding the flag ---
// The player can't fight it — a cutscene plays when they get close.
const BOSS_WAKE_X = 2560;   // player crosses this and the cutscene starts
const BOSS_CHARGE_SPEED = 2.4;

// --- Cutscene state machine ---
// States: null (not started) → 'freeze' → 'charge' → 'rescue' → 'done'
let cutscene = null;
let cutsceneTimer = 0;
let rescueNPC = null;

let frameCount = 0;
let gameState = 'title'; // 'title' | 'playing' | 'win' | 'gameover'
let score = 0;
let lives = 3;

const camera = { x: 0 };

// ============================================
// AUDIO — procedural cyberpunk soundtrack + SFX
// (no external files; everything is synthesized)
// ============================================
let audioCtx = null;
let masterGain = null;
let musicGain = null;
let sfxGain = null;
let muted = false;
let noiseBuffer = null;
let musicTimer = null;
let nextNoteTime = 0;
let step16 = 0;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 1;
  masterGain.connect(audioCtx.destination);

  musicGain = audioCtx.createGain();
  musicGain.gain.value = 0.22;
  musicGain.connect(masterGain);

  sfxGain = audioCtx.createGain();
  sfxGain.gain.value = 0.35;
  sfxGain.connect(masterGain);

  // pre-render a short noise buffer, reused for hats/hits/explosions
  const dur = 0.5;
  noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
  const data = noiseBuffer.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;

  nextNoteTime = audioCtx.currentTime + 0.1;
  step16 = 0;
  musicTimer = setInterval(scheduleMusic, 25);
}

function toggleMute() {
  if (!audioCtx) return;
  muted = !muted;
  masterGain.gain.value = muted ? 0 : 1;
}

function tone(freq, startTime, duration, type, gainVal, dest, filterFreq, glideTo) {
  const osc = audioCtx.createOscillator();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, startTime);
  if (glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, startTime + duration);

  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0, startTime);
  gain.gain.linearRampToValueAtTime(gainVal, startTime + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

  let node = osc;
  if (filterFreq) {
    const filt = audioCtx.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.value = filterFreq;
    osc.connect(filt);
    filt.connect(gain);
  } else {
    osc.connect(gain);
  }
  gain.connect(dest);
  osc.start(startTime);
  osc.stop(startTime + duration + 0.02);
}

function noiseBurst(startTime, duration, gainVal, dest, filterType, filterFreq) {
  const src = audioCtx.createBufferSource();
  src.buffer = noiseBuffer;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(gainVal, startTime);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  const filt = audioCtx.createBiquadFilter();
  filt.type = filterType || 'highpass';
  filt.frequency.value = filterFreq || 4000;
  src.connect(filt);
  filt.connect(gain);
  gain.connect(dest);
  src.start(startTime);
  src.stop(startTime + duration + 0.02);
}

// cyberpunk 16-step loop: sawtooth bass + square arpeggio + noise hats
const BASS_STEPS = [110, null, null, null, 146.83, null, null, null, 130.81, null, null, null, 98, null, null, null];
const ARP_STEPS  = [220, null, 261.63, 329.63, null, 440, 329.63, 261.63, 220, null, 293.66, 349.23, null, 440, 392, 329.63];

function scheduleMusic() {
  if (!audioCtx) return;
  const sixteenth = (60 / 128) / 4;
  while (nextNoteTime < audioCtx.currentTime + 0.12) {
    const bassFreq = BASS_STEPS[step16];
    if (bassFreq) tone(bassFreq, nextNoteTime, 0.42, 'sawtooth', 0.22, musicGain, 500);

    const arpFreq = ARP_STEPS[step16];
    if (arpFreq) tone(arpFreq, nextNoteTime, 0.14, 'square', 0.10, musicGain, 2400);

    if (step16 % 4 === 2) noiseBurst(nextNoteTime, 0.05, 0.05, musicGain, 'highpass', 6000);

    nextNoteTime += sixteenth;
    step16 = (step16 + 1) % 16;
  }
}

function playJump() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  tone(320, t, 0.12, 'square', 0.18, sfxGain, 3000, 640);
}
function playStomp() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  tone(420, t, 0.14, 'sawtooth', 0.2, sfxGain, 1200, 90);
  noiseBurst(t, 0.08, 0.15, sfxGain, 'lowpass', 1500);
}
function playCoin() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  tone(880, t, 0.08, 'square', 0.15, sfxGain, 5000);
  tone(1318.5, t + 0.06, 0.1, 'square', 0.15, sfxGain, 5000);
}
function playHit() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  tone(400, t, 0.3, 'sawtooth', 0.22, sfxGain, 900, 70);
  noiseBurst(t, 0.2, 0.15, sfxGain, 'lowpass', 800);
}
function playMissile() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  tone(150, t, 0.2, 'sawtooth', 0.2, sfxGain, 500, 60);
  noiseBurst(t, 0.15, 0.18, sfxGain, 'lowpass', 3000);
}
function playExplosion() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  tone(80, t, 0.25, 'sine', 0.3, sfxGain, null);
  noiseBurst(t, 0.35, 0.28, sfxGain, 'lowpass', 2000);
}
function playSurprise() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  // a silly upward "boing" — deliberately cartoonish
  tone(220, t, 0.18, 'square', 0.16, sfxGain, 3500, 900);
  tone(140, t + 0.02, 0.14, 'triangle', 0.12, sfxGain, 2000, 500);
}
function playChainsawStart() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  // a nasty two-pull rev
  tone(90, t, 0.28, 'sawtooth', 0.26, sfxGain, 1400, 260);
  noiseBurst(t, 0.3, 0.2, sfxGain, 'bandpass', 1800);
  tone(120, t + 0.32, 0.45, 'sawtooth', 0.26, sfxGain, 2200, 420);
  noiseBurst(t + 0.32, 0.5, 0.22, sfxGain, 'bandpass', 2400);
}
function playChainsawLoop() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  tone(300, t, 0.48, 'sawtooth', 0.12, sfxGain, 2600, 340);
  noiseBurst(t, 0.45, 0.07, sfxGain, 'bandpass', 3000);
}
function playDeflect() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  tone(1400, t, 0.1, 'square', 0.16, sfxGain, 6000, 700);
  noiseBurst(t, 0.12, 0.2, sfxGain, 'highpass', 5000);
}
function playCheckpoint() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  tone(523.25, t, 0.1, 'square', 0.16, sfxGain, 4000);
  tone(659.25, t + 0.1, 0.16, 'square', 0.16, sfxGain, 4000);
}
function playWin() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, t + i * 0.12, 0.18, 'square', 0.18, sfxGain, 4500));
}
function playGameOver() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  [392, 349.23, 293.66, 220].forEach((f, i) => tone(f, t + i * 0.15, 0.25, 'sawtooth', 0.18, sfxGain, 900));
}

// ============================================
// PLAYER (a square, defending its corners)
// ============================================
const player = {
  x: 100, y: 0, width: 22, height: 22,
  velocityX: 0, velocityY: 0,
  isOnGround: false,
  facing: 1,
  invincible: 0,
  weaponTimer: 0,
  bazookaCooldown: 0,
  coyoteTimer: 0,
  jumpBuffer: 0,
  jumpCut: true,
  wasOnGround: false,
  shout: 0
};

let respawnPoint = { x: 100, y: 300 };

function resetPlayer() {
  player.x = respawnPoint.x;
  player.y = respawnPoint.y;
  player.velocityX = 0;
  player.velocityY = 0;
  player.isOnGround = false;
  player.invincible = 90;
  player.coyoteTimer = 0;
  player.jumpBuffer = 0;
  player.jumpCut = true;
  player.wasOnGround = false;

  // reset the boss and cutscene so the sequence plays out again
  cutscene = null;
  cutsceneTimer = 0;
  rescueNPC = null;
  enemies.filter(e => e.boss).forEach(boss => {
    boss.alive = true;
    boss.squish = 0;
    boss.awake = false;
    boss.sawRev = 0;
    boss.shout = 0;
    boss.x = boss.baseX;
    boss.y = boss.baseY;
    boss.hopVY = 0;
    boss.speed = Math.abs(boss.speed) || 1.2;
  });
}

// ============================================
// STATIC LEVEL GEOMETRY
// ============================================
const platforms = [
  { x: 0,    y: GROUND_Y, width: 420, height: 40, ground: true },
  { x: 580,  y: GROUND_Y, width: 770, height: 40, ground: true },
  { x: 1560, y: GROUND_Y, width: 590, height: 40, ground: true },
  { x: 2320, y: GROUND_Y, width: 880, height: 40, ground: true },

  { x: 150,  y: 320, width: 120, height: 18 },
  { x: 470,  y: 330, width: 90,  height: 18 },
  { x: 650,  y: 300, width: 120, height: 18 },
  { x: 900,  y: 230, width: 100, height: 18 },
  { x: 1150, y: 320, width: 100, height: 18 },
  { x: 1620, y: 280, width: 140, height: 18 },
  { x: 1750, y: 200, width: 100, height: 18 },
  { x: 2040, y: 300, width: 190, height: 18 },
  { x: 2350, y: 260, width: 130, height: 18 },
  { x: 2600, y: 200, width: 100, height: 18 },
  { x: 2850, y: 300, width: 120, height: 18 }
];

// The troll pit's stepping-stone island: it looks like an ordinary ledge in
// the middle of a wide pit, but it eases sideways while the player is airborne
// over the pit, then eases back once they land. The pit spans 1350-1560 with
// the island resting at 1400-1480, so the island is genuinely needed to cross
// — which is exactly what makes moving it a good prank.
const TRICK_SHIFT = 38;  // how far the island slides, in pixels
const TRICK_EASE = 0.09; // how smoothly it eases toward its target (lower = smoother/slower)
const trickLip = { x: 1400, baseX: 1400, offset: 0, y: GROUND_Y, width: 80, height: 40, ground: true, trick: true };
platforms.push(trickLip);

// The last pit's retracting ledge. At rest it fills 2190-2320, leaving a
// piddly 40px pit (half the original 80px) that looks trivially jumpable.
// The moment the player leaves the ground it retracts completely, stretching
// the pit to 170px and holding it open for the whole jump: too far to clear
// from ground level, but just makeable from the raised platform at 2040-2170.
const RETRACT_EASE = 0.12;
const retractLedge = {
  x: 2190, baseX: 2190, baseWidth: 130, progress: 0,
  y: GROUND_Y, width: 130, height: 40, ground: true, retract: true
};
platforms.push(retractLedge);

// The FIRST pit's eroding lip. It looks like ordinary ground running out to
// x=500. The moment the player is airborne over the pit it crumbles backwards
// — its right edge (the near side of the opening) pulls in toward the player,
// stretching the pit from 80px to 160px beneath them. The platform at 470-560
// is the way across once that happens.
const ERODE_EASE = 0.14;
const erodeLip = {
  x: 420, baseX: 420, baseWidth: 80, progress: 0,
  y: GROUND_Y, width: 80, height: 40, ground: true, erode: true
};
platforms.push(erodeLip);

const goal = { x: 3100, y: 200, width: 10, height: GROUND_Y - 200 };
const checkpoint = { x: 1600, y: GROUND_Y - 70, width: 8, height: 70, activated: false };

// Hazard stripes: any ground edge with an actual gap after it gets a visible
// warning strip. Computed fresh each frame (rather than once at startup) so
// the stripes on the moving ledges travel with them instead of hanging in midair.
const HAZARD_WIDTH = 18;
function computeHazardStripes() {
  const stripes = [];
  const segs = platforms.filter(p => p.ground && p.width > 2).sort((a, b) => a.x - b.x);
  segs.forEach((seg, i) => {
    if (i === 0) return;
    const prev = segs[i - 1];
    if (seg.x - (prev.x + prev.width) > 2) {
      stripes.push({ x: prev.x + prev.width - HAZARD_WIDTH, y: prev.y, width: HAZARD_WIDTH });
      stripes.push({ x: seg.x, y: seg.y, width: HAZARD_WIDTH });
    }
  });
  return stripes;
}

// ============================================
// DYNAMIC ENTITIES (rebuilt on reset)
// ============================================
let enemies = [];
let coins = [];
let missiles = [];
let particles = [];
let dustTimer = 0;

// Set true by the secret unlock so the boss gives up and the flag works.
function bossActive() {
  // the boss blocks the flag until the cutscene NPC has dealt with it
  if (cutscene === 'done') return false;
  return enemies.some(e => e.boss && e.alive);
}
let toast = { text: null, timer: 0 };

function createEnemies() {
  const base = [
    { x: 250,  y: GROUND_Y - 22, w: 22, minX: 220,  maxX: 460,  speed: 1.4 },
    { x: 700,  y: GROUND_Y - 22, w: 22, minX: 650,  maxX: 950,  speed: 1.7 },
    { x: 660,  y: 300 - 20,      w: 20, minX: 655,  maxX: 750,  speed: 1.1 },
    { x: 1600, y: GROUND_Y - 22, w: 22, minX: 1580, maxX: 1800, speed: 1.6 },
    { x: 1760, y: 200 - 20,      w: 20, minX: 1755, maxX: 1830, speed: 1.0 },
    { x: 2980, y: GROUND_Y - 26, w: 26, minX: 2900, maxX: 3100, speed: 1.2, boss: true },
    { x: 2360, y: 260 - 20,      w: 20, minX: 2355, maxX: 2460, speed: 1.1 }
  ];
  return base.map(e => ({
    ...e,
    alive: true,
    squish: 0,
    baseY: e.y,
    baseX: e.x,
    hopVY: 0,
    hopTimer: 90 + Math.floor(Math.random() * 150), // ticks down to the next surprise hop
    shout: 0,
    awake: false,   // boss only: has the chainsaw come out yet
    sawRev: 0       // boss only: chainsaw spin/buzz timer
  }));
}

function createCoins() {
  const pts = [
    [180, 280], [230, 280], [680, 260], [730, 260],
    [920, 190], [1170, 280], [1220, 280], [1530, 240],
    [1580, 240], [1770, 160], [2075, 260], [2125, 260],
    [2370, 220], [2620, 160], [2870, 260], [2920, 260],
    [1000, 380], [1900, 380], [2900, 380]
  ];
  return pts.map(p => ({ x: p[0], y: p[1], size: 12, collected: false }));
}

function resetGame() {
  score = 0;
  lives = 3;
  enemies = createEnemies();
  coins = createCoins();
  missiles = [];
  particles = [];
  dustTimer = 0;
  cutscene = null;
  cutsceneTimer = 0;
  rescueNPC = null;
  checkpoint.activated = false;
  respawnPoint = { x: 100, y: 300 };
  trickLip.offset = 0;
  trickLip.x = trickLip.baseX;
  retractLedge.progress = 0;
  retractLedge.x = retractLedge.baseX;
  retractLedge.width = retractLedge.baseWidth;
  erodeLip.progress = 0;
  erodeLip.width = erodeLip.baseWidth;
  resetPlayer();
  camera.x = 0;
  gameState = 'playing';
  showToast('', 0);
}

function showToast(text, duration) {
  toast.text = text;
  toast.timer = duration;
}

// ============================================
// INPUT
// ============================================
const keys = {};
document.addEventListener('keydown', (e) => {
  if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();

  const alreadyDown = keys[e.key];
  keys[e.key] = true;

  if (!audioCtx) initAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

  if (e.key === 'm' || e.key === 'M') toggleMute();

  // secret unlock (parents only): Shift+K calls the sphere off so the flag works
  // Shift+K skips the cutscene if it's playing
  if (e.shiftKey && (e.key === 'K' || e.key === 'k') && gameState === 'playing' && cutscene && cutscene !== 'done') {
    const boss = enemies.find(b => b.boss && b.alive);
    if (boss) {
      boss.alive = false;
      boss.squish = 14;
      spawnExplosion(boss.x + boss.w / 2, boss.y + boss.w / 2, '#8effc0');
      playExplosion();
    }
    cutscene = 'done';
    rescueNPC = null;
    showToast('THE SPHERES RETREAT!', 120);
  }

  if ((e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') && !alreadyDown) {
    player.jumpBuffer = JUMP_BUFFER_FRAMES;
  }

  if (gameState === 'title' && (e.key === ' ' || e.key === 'Enter')) {
    resetGame();
  } else if ((gameState === 'win' || gameState === 'gameover') && (e.key === 'r' || e.key === 'R' || e.key === ' ' || e.key === 'Enter')) {
    resetGame();
  }
});
document.addEventListener('keyup', (e) => { keys[e.key] = false; });

// ============================================
// COLLISION HELPER
// ============================================
function isColliding(a, b) {
  return (
    a.x < b.x + b.width &&
    a.x + a.width > b.x &&
    a.y < b.y + b.height &&
    a.y + a.height > b.y
  );
}

// ============================================
// EASTER EGG: the bazooka
// ============================================
function fireMissile() {
  // silently eaten during the cutscene
  if (cutscene && cutscene !== 'done') return;

  if (player.bazookaCooldown > 0) {
    if (toast.timer <= 0) showToast('COOLING DOWN', 50);
    return;
  }

  player.bazookaCooldown = BAZOOKA_COOLDOWN;
  player.weaponTimer = 16;
  const mx = player.x + player.width / 2 + player.facing * 36;
  const my = player.y + player.height / 2 - 11.5;
  missiles.push({ x: mx, y: my, spawnX: mx, dir: player.facing, w: 12, h: 5 });
  playMissile();
}

function spawnExplosion(x, y, color) {
  for (let i = 0; i < 10; i++) {
    const angle = (Math.PI * 2 * i) / 10;
    particles.push({
      x, y,
      vx: Math.cos(angle) * (1.5 + Math.random() * 2),
      vy: Math.sin(angle) * (1.5 + Math.random() * 2),
      life: 20,
      maxLife: 20,
      size: 6,
      color,
      rotate: true,
      shrink: false
    });
  }
}

function spawnDust(x, y, count, opts) {
  opts = opts || {};
  const life = opts.life || 26;
  const color = opts.color || 'rgba(235, 210, 150, 0.9)';
  const size = opts.size || 9;
  const spread = opts.spread || 1.6;
  const driftX = opts.driftX || 0;
  for (let i = 0; i < count; i++) {
    particles.push({
      x: x + (Math.random() - 0.5) * 10,
      y: y + (Math.random() - 0.5) * 6,
      vx: driftX + (Math.random() - 0.5) * spread,
      vy: -Math.random() * 1.1 - 0.3,
      life, maxLife: life,
      size: size * (0.8 + Math.random() * 0.7),
      color,
      rotate: false,
      angle: Math.random() * Math.PI,
      shrink: true,
      easeShrink: true
    });
  }
}

// ============================================
// UPDATE
// ============================================
function update() {
  if (gameState !== 'playing') return;
  frameCount++;

  // --- during the cutscene the player is frozen in place ---
  const inputLocked = cutscene && cutscene !== 'done';

  // --- horizontal input with acceleration / friction / turnaround boost ---
  const left = !inputLocked && (keys['ArrowLeft'] || keys['a']);
  const right = !inputLocked && (keys['ArrowRight'] || keys['d']);

  if (left && !right) {
    if (player.velocityX > 0) player.velocityX -= TURN_ACCEL; // reversing: extra kick to kill old momentum
    player.velocityX -= ACCEL;
    player.facing = -1;
  } else if (right && !left) {
    if (player.velocityX < 0) player.velocityX += TURN_ACCEL;
    player.velocityX += ACCEL;
    player.facing = 1;
  } else {
    if (player.velocityX > 0) player.velocityX = Math.max(0, player.velocityX - FRICTION);
    else if (player.velocityX < 0) player.velocityX = Math.min(0, player.velocityX + FRICTION);
  }
  player.velocityX = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, player.velocityX));

  // --- coyote time: still allowed to jump briefly after leaving a ledge ---
  if (player.isOnGround) player.coyoteTimer = COYOTE_FRAMES;
  else if (player.coyoteTimer > 0) player.coyoteTimer--;

  // --- jump buffer: a press just before landing still fires the jump ---
  if (player.jumpBuffer > 0) player.jumpBuffer--;

  if (!inputLocked && player.jumpBuffer > 0 && player.coyoteTimer > 0) {
    player.velocityY = JUMP_FORCE;
    player.isOnGround = false;
    player.coyoteTimer = 0;
    player.jumpBuffer = 0;
    player.jumpCut = false;
    playJump();
    spawnDust(player.x + player.width / 2, player.y + player.height, 9, { spread: 3.2, size: 8, life: 20 });
  }

  // --- variable jump height: releasing the key early cuts the jump short ---
  const jumpHeld = keys[' '] || keys['ArrowUp'] || keys['w'];
  if (!jumpHeld && !player.jumpCut && player.velocityY < 0) {
    player.velocityY *= JUMP_CUT_MULTIPLIER;
    player.jumpCut = true;
  }

  // --- bazooka ---
  if (player.bazookaCooldown > 0) player.bazookaCooldown--;
  if (player.weaponTimer > 0) player.weaponTimer--;
  if (keys['b'] || keys['B']) fireMissile();

  // --- gravity: heavier on the way down for a snappier, more predictable arc ---
  player.velocityY += (player.velocityY < 0) ? GRAVITY_UP : GRAVITY_DOWN;
  const incomingFallSpeed = player.velocityY;

  // --- move ---
  player.x += player.velocityX;
  player.y += player.velocityY;

  // --- world bounds ---
  if (player.x < 0) { player.x = 0; player.velocityX = 0; }
  if (player.x + player.width > WORLD_WIDTH) { player.x = WORLD_WIDTH - player.width; player.velocityX = 0; }

  // --- the troll pit: the landing lip eases away while airborne over it, then eases back ---
  const nearTrollPit = player.x + player.width > 1300 && player.x < 1640;
  const trickTarget = (nearTrollPit && !player.isOnGround) ? TRICK_SHIFT : 0;
  trickLip.offset += (trickTarget - trickLip.offset) * TRICK_EASE;
  const prevTrickLipX = trickLip.x;
  trickLip.x = trickLip.baseX + trickLip.offset;
  const trickLipDelta = trickLip.x - prevTrickLipX;

  // --- the last pit: looks like a trivial 40px hop, but the ledge retracts
  //     the instant the player is airborne and stays gone for the whole jump ---
  const nearLastPit = player.x + player.width > 2090 && player.x < 2400;
  const retractTarget = (nearLastPit && !player.isOnGround) ? 1 : 0;
  retractLedge.progress += (retractTarget - retractLedge.progress) * RETRACT_EASE;
  retractLedge.x = retractLedge.baseX + retractLedge.progress * retractLedge.baseWidth;
  retractLedge.width = retractLedge.baseWidth * (1 - retractLedge.progress);

  // --- the first pit: its near edge crumbles back toward the player as he
  //     approaches, so the ground he meant to jump from isn't there anymore ---
  const nearFirstPit = player.x + player.width > 330 && player.x < 640;
  const erodeTarget = nearFirstPit ? 1 : 0;
  erodeLip.progress += (erodeTarget - erodeLip.progress) * ERODE_EASE;
  // x stays put and the width shrinks, so the RIGHT edge (the front of the
  // opening) travels left, toward the player
  erodeLip.width = erodeLip.baseWidth * (1 - erodeLip.progress);

  // --- platform collisions ---
  player.isOnGround = false;
  let standingPlatform = null;
  for (const platform of platforms) {
    if (platform.width <= 1) continue; // a fully retracted ledge is not solid
    if (isColliding(player, platform)) {
      const overlapLeft   = (player.x + player.width) - platform.x;
      const overlapRight  = (platform.x + platform.width) - player.x;
      const overlapTop    = (player.y + player.height) - platform.y;
      const overlapBottom = (platform.y + platform.height) - player.y;
      const minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);

      if (minOverlap === overlapTop && player.velocityY >= 0) {
        player.y = platform.y - player.height;
        player.velocityY = 0;
        player.isOnGround = true;
        standingPlatform = platform;
      } else if (minOverlap === overlapBottom && player.velocityY < 0) {
        player.y = platform.y + platform.height;
        player.velocityY = 0;
      } else if (minOverlap === overlapLeft && player.velocityX >= 0) {
        player.x = platform.x - player.width;
        player.velocityX = 0;
      } else if (minOverlap === overlapRight && player.velocityX <= 0) {
        player.x = platform.x + platform.width;
        player.velocityX = 0;
      }
    }
  }

  // ride the trick lip smoothly instead of being left behind as it eases back
  if (standingPlatform === trickLip) {
    player.x += trickLipDelta;
  }

  // --- landing dust: a puff sized to how hard the landing was ---
  if (!player.wasOnGround && player.isOnGround) {
    const impact = Math.min(16, Math.max(6, Math.round(incomingFallSpeed * 1.6)));
    spawnDust(player.x + player.width / 2, player.y + player.height, impact, { spread: 4, size: 9, life: 26 });
  }
  player.wasOnGround = player.isOnGround;

  // --- running dust: puffs kicked up behind the player while moving on the ground ---
  if (player.isOnGround && Math.abs(player.velocityX) > 0.6) {
    dustTimer--;
    if (dustTimer <= 0) {
      dustTimer = 3;
      const footX = player.x + player.width / 2 - player.facing * (player.width / 2 - 2);
      spawnDust(footX, player.y + player.height - 1, 3, {
        spread: 2.2,
        driftX: -player.facing * 1.2,
        size: 8,
        life: 22
      });
    }
  } else {
    dustTimer = 0;
  }

  // --- fell into a pit ---
  if (player.y > VIEW_HEIGHT + 100) {
    playHit();
    loseLife();
  }

  // --- invincibility countdown ---
  if (player.invincible > 0) player.invincible--;

  // --- checkpoint ---
  if (!checkpoint.activated && isColliding(player, checkpoint)) {
    checkpoint.activated = true;
    respawnPoint = { x: checkpoint.x, y: checkpoint.y - 20 };
    showToast('CHECKPOINT REACHED', 90);
    playCheckpoint();
  }

  // --- cutscene: the chainsaw showdown ---
  if (cutscene === null) {
    const boss = enemies.find(e => e.boss && e.alive);
    if (boss && player.x + player.width > BOSS_WAKE_X) {
      cutscene = 'freeze';
      cutsceneTimer = 0;
      player.velocityX = 0;
      player.velocityY = 0;
      boss.awake = true;
      boss.sawRev = 1;
      boss.shout = 40;
      playChainsawStart();
    }
  }

  if (cutscene === 'freeze') {
    player.velocityX = 0;
    player.shout = 30;
    cutsceneTimer++;
    const boss = enemies.find(e => e.boss && e.alive);
    if (boss) {
      boss.sawRev++;
      if (boss.sawRev % 26 === 0) playChainsawLoop();
    }
    if (cutsceneTimer > 120) {
      cutscene = 'charge';
      cutsceneTimer = 0;
    }
  }

  if (cutscene === 'charge') {
    player.velocityX = 0;
    player.shout = 30;
    const boss = enemies.find(e => e.boss && e.alive);
    if (boss) {
      boss.speed = -BOSS_CHARGE_SPEED;
      boss.x += boss.speed;
      boss.sawRev++;
      if (boss.sawRev % 26 === 0) playChainsawLoop();
    }
    cutsceneTimer++;

    if (cutsceneTimer === 40 && !rescueNPC) {
      rescueNPC = {
        x: camera.x - 60,
        y: GROUND_Y - 44,
        width: 44, height: 44,
        velocityX: 8.5,
        velocityY: 0,
        jumpVX: 0,
        facing: 1,
        state: 'running',
        timer: 0,
        stomped: false
      };
    }

    if (rescueNPC && rescueNPC.stomped) {
      cutscene = 'rescue';
      cutsceneTimer = 0;
    }

    if (boss && boss.x < player.x + player.width + 40) {
      boss.x = player.x + player.width + 40;
    }

    if (cutsceneTimer > 300) {
      if (boss) {
        boss.alive = false;
        boss.squish = 14;
        spawnExplosion(boss.x + boss.w / 2, boss.y + boss.w / 2, '#8effc0');
        playExplosion();
      }
      cutscene = 'rescue';
      cutsceneTimer = 0;
    }
  }

  if (cutscene === 'rescue') {
    player.shout = 0;
    cutsceneTimer++;
    if (cutsceneTimer > 100) {
      cutscene = 'done';
      showToast('COAST IS CLEAR!', 120);
    }
  }

  // --- update the rescue NPC ---
  if (rescueNPC) {
    const npc = rescueNPC;
    const boss = enemies.find(e => e.boss);
    if (npc.state === 'running') {
      npc.x += npc.velocityX;
      if (boss && boss.alive) {
        const dist = boss.x - (npc.x + npc.width);
        if (dist < 180 && dist > 0) {
          npc.state = 'jumping';
          npc.velocityY = -14;
          npc.jumpVX = 2.0;
        }
      }
    } else if (npc.state === 'jumping') {
      npc.velocityY += 0.68;
      npc.x += npc.jumpVX;
      npc.y += npc.velocityY;
      if (boss && boss.alive && npc.velocityY > 0) {
        const npcCX = npc.x + npc.width / 2;
        const bossCX = boss.x + boss.w / 2;
        const overlap = Math.abs(npcCX - bossCX) < (npc.width / 2 + boss.w / 2);
        if (overlap && npc.y + npc.height >= boss.y) {
          boss.alive = false;
          boss.squish = 14;
          score += 200;
          playStomp();
          spawnExplosion(boss.x + boss.w / 2, boss.y + boss.w / 2, '#8effc0');
          spawnDust(boss.x + boss.w / 2, boss.y + boss.w, 12, { spread: 4, size: 10, life: 28 });
          npc.velocityY = STOMP_BOUNCE;
          npc.state = 'landing';
          npc.stomped = true;
          npc.timer = 0;
        }
      }
      if (!npc.stomped && npc.y + npc.height >= GROUND_Y) {
        npc.y = GROUND_Y - npc.height;
        npc.velocityY = 0;
        if (boss && boss.alive) {
          boss.alive = false;
          boss.squish = 14;
          score += 200;
          playStomp();
          spawnExplosion(boss.x + boss.w / 2, boss.y + boss.w / 2, '#8effc0');
        }
        npc.state = 'posing';
        npc.stomped = true;
        npc.timer = 0;
      }
    } else if (npc.state === 'landing') {
      npc.velocityY += 0.68;
      npc.y += npc.velocityY;
      if (npc.y + npc.height >= GROUND_Y) {
        npc.y = GROUND_Y - npc.height;
        npc.velocityY = 0;
        npc.velocityX = 0;
        npc.state = 'posing';
        npc.timer = 0;
      }
    } else if (npc.state === 'posing') {
      npc.timer++;
      if (npc.timer > 70) {
        npc.state = 'exit';
        npc.velocityX = 5;
      }
    } else if (npc.state === 'exit') {
      npc.x += npc.velocityX;
      if (npc.x > camera.x + VIEW_WIDTH + 60) {
        rescueNPC = null;
      }
    }
  }

  // --- enemies ---
  for (const enemy of enemies) {
    if (!enemy.alive) {
      if (enemy.squish > 0) enemy.squish--;
      continue;
    }

    // boss movement is driven by the cutscene, not patrol AI
    if (enemy.boss) {
      if (!enemy.awake) {
        enemy.x += enemy.speed;
        if (enemy.x < enemy.minX || enemy.x + enemy.w > enemy.maxX) {
          enemy.speed *= -1;
          enemy.x = Math.max(enemy.minX, Math.min(enemy.x, enemy.maxX - enemy.w));
        }
      }
      // boss collision during cutscene — don't kill the player
      if (cutscene && cutscene !== 'done') continue;
    } else {
      enemy.x += enemy.speed;
      if (enemy.x < enemy.minX || enemy.x + enemy.w > enemy.maxX) {
        enemy.speed *= -1;
        enemy.x = Math.max(enemy.minX, Math.min(enemy.x, enemy.maxX - enemy.w));
      }

      // --- surprise! every so often a sphere randomly hops instead of just rolling ---
      if (enemy.hopVY === 0 && enemy.y === enemy.baseY) {
        enemy.hopTimer--;
        if (enemy.hopTimer <= 0) {
          enemy.hopVY = -7.5;
          enemy.shout = 22;
          enemy.hopTimer = 150 + Math.floor(Math.random() * 200);
          playSurprise();
        }
      }
    }

    if (enemy.hopVY !== 0 || enemy.y !== enemy.baseY) {
      enemy.hopVY += 0.5;
      enemy.y += enemy.hopVY;
      if (enemy.y >= enemy.baseY) {
        enemy.y = enemy.baseY;
        enemy.hopVY = 0;
      }
    }
    if (enemy.shout > 0) enemy.shout--;

    const eBox = { x: enemy.x, y: enemy.y, width: enemy.w, height: enemy.w };
    if (isColliding(player, eBox)) {
      if (enemy.boss) {
        // the boss can't be killed by the player — bounce off harmlessly
        player.velocityY = STOMP_BOUNCE;
        player.x = enemy.x - player.width - 5;
      } else {
        const fromAbove = player.velocityY > 0 && (player.y + player.height) - enemy.y < enemy.w * 0.6;
        if (fromAbove) {
          enemy.alive = false;
          enemy.squish = 14;
          player.velocityY = STOMP_BOUNCE;
          score += 100;
          playStomp();
        } else if (player.invincible <= 0) {
          playHit();
          loseLife();
        }
      }
    }
  }

  // --- missiles ---
  for (const missile of missiles) {
    missile.x += missile.dir * MISSILE_SPEED;
    // fizzle out after traveling the max range
    if (!missile.hit && Math.abs(missile.x - missile.spawnX) > MISSILE_RANGE) {
      missile.hit = true;
      spawnExplosion(missile.x, missile.y, '#7a84a8');
    }
  }
  missiles = missiles.filter(m => m.x > -50 && m.x < WORLD_WIDTH + 50);

  for (const missile of missiles) {
    if (!missile.hit) {
      for (const enemy of enemies) {
        if (!enemy.alive) continue;
        const eBox = { x: enemy.x, y: enemy.y, width: enemy.w, height: enemy.w };
        const mBox = { x: missile.x - missile.w / 2, y: missile.y - missile.h / 2, width: missile.w, height: missile.h };
        if (isColliding(mBox, eBox)) {
          // the boss can't be killed by missiles — deflect them
          if (enemy.boss) {
            missile.hit = true;
            spawnExplosion(missile.x, missile.y, '#ffdf7a');
            playDeflect();
            break;
          }
          enemy.alive = false;
          enemy.squish = 14;
          score += 150;
          missile.hit = true;
          spawnExplosion(enemy.x + enemy.w / 2, enemy.y + enemy.w / 2, '#8effc0');
          playExplosion();
          break;
        }
      }
    }
  }
  missiles = missiles.filter(m => !m.hit);

  // --- particles ---
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
  }
  particles = particles.filter(p => p.life > 0);

  // --- coins ---
  for (const coin of coins) {
    if (coin.collected) continue;
    const cBox = { x: coin.x - coin.size / 2, y: coin.y - coin.size / 2, width: coin.size, height: coin.size };
    if (isColliding(player, cBox)) {
      coin.collected = true;
      score += 10;
      playCoin();
    }
  }

  // --- goal ---
  if (isColliding(player, goal)) {
    if (bossActive()) {
      // the sphere body-blocks the flag — taunt and shove the player back
      player.x = goal.x - player.width - 30;
      player.velocityX = 0;
      if (toast.timer <= 0) showToast('THE SPHERE WON\'T LET YOU', 80);
    } else {
      gameState = 'win';
      playWin();
    }
  }

  // --- toast timer ---
  if (toast.timer > 0) toast.timer--;

  // --- camera follows player, clamped to world ---
  const targetCameraX = Math.max(0, Math.min(player.x - VIEW_WIDTH / 2.6, WORLD_WIDTH - VIEW_WIDTH));
  camera.x += (targetCameraX - camera.x) * 0.12;
}

function loseLife() {
  lives--;
  if (lives <= 0) {
    gameState = 'gameover';
    playGameOver();
  } else {
    resetPlayer();
  }
}

// ============================================
// DRAW
// ============================================
function drawBackground() {
  ctx.fillStyle = '#10162c';
  ctx.fillRect(0, 0, VIEW_WIDTH, VIEW_HEIGHT);

  ctx.save();
  const farOffset = -camera.x * 0.15;
  ctx.fillStyle = 'rgba(255, 77, 141, 0.06)';
  for (let i = 0; i < 8; i++) {
    const cx = (i * 420 + farOffset) % (VIEW_WIDTH + 800) - 200;
    ctx.beginPath();
    ctx.arc(cx, 90 + (i % 3) * 40, 60, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  ctx.save();
  const gridOffset = -camera.x * 0.4;
  ctx.strokeStyle = 'rgba(242, 193, 78, 0.05)';
  ctx.lineWidth = 1;
  const spacing = 40;
  for (let x = (gridOffset % spacing); x < VIEW_WIDTH; x += spacing) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, VIEW_HEIGHT);
    ctx.stroke();
  }
  for (let y = 0; y < VIEW_HEIGHT; y += spacing) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(VIEW_WIDTH, y);
    ctx.stroke();
  }
  ctx.restore();
}

function drawPlatforms() {
  // Fills first. Ground segments are filled without their own outline so that
  // two flush segments read as one continuous surface — otherwise the seam
  // between them gives away where the retracting ledge is hiding.
  for (const p of platforms) {
    if (p.width <= 1) continue;
    if (p.ground) {
      ctx.fillStyle = '#1c2547';
      ctx.fillRect(p.x, p.y, p.width, p.height);
    } else {
      ctx.fillStyle = '#232f5c';
      ctx.fillRect(p.x, p.y, p.width, p.height);
      ctx.strokeStyle = '#3a4a82';
      ctx.lineWidth = 2;
      ctx.strokeRect(p.x + 1, p.y + 1, p.width - 2, p.height - 2);
    }
  }

  // Ground outlines: a top line along every segment, but vertical edges only
  // where an actual pit begins or ends.
  const segs = platforms.filter(p => p.ground && p.width > 1).sort((a, b) => a.x - b.x);
  ctx.strokeStyle = '#3a4a82';
  ctx.lineWidth = 2;
  segs.forEach((seg, i) => {
    const prev = segs[i - 1];
    const next = segs[i + 1];
    const gapBefore = !prev || (seg.x - (prev.x + prev.width) > 2);
    const gapAfter = !next || (next.x - (seg.x + seg.width) > 2);

    ctx.beginPath();
    ctx.moveTo(seg.x, seg.y + 1);
    ctx.lineTo(seg.x + seg.width, seg.y + 1);
    ctx.stroke();

    if (gapBefore) {
      ctx.beginPath();
      ctx.moveTo(seg.x + 1, seg.y + 1);
      ctx.lineTo(seg.x + 1, seg.y + seg.height);
      ctx.stroke();
    }
    if (gapAfter) {
      ctx.beginPath();
      ctx.moveTo(seg.x + seg.width - 1, seg.y + 1);
      ctx.lineTo(seg.x + seg.width - 1, seg.y + seg.height);
      ctx.stroke();
    }
  });

  drawHazardStripes();
}

function drawHazardStripes() {
  // diagonal amber/dark hazard tape along the top edge of every ground
  // segment that borders a pit — visible well before the player reaches it
  for (const h of computeHazardStripes()) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(h.x, h.y, h.width, 6);
    ctx.clip();
    ctx.fillStyle = '#1c2547';
    ctx.fillRect(h.x, h.y, h.width, 6);
    ctx.fillStyle = '#f2c14e';
    const stripeSpacing = 8;
    for (let sx = h.x - 6; sx < h.x + h.width + 6; sx += stripeSpacing) {
      ctx.beginPath();
      ctx.moveTo(sx, h.y + 6);
      ctx.lineTo(sx + 4, h.y);
      ctx.lineTo(sx + 8, h.y);
      ctx.lineTo(sx + 4, h.y + 6);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }
}

function drawGoal() {
  ctx.fillStyle = '#5ee7ff';
  ctx.fillRect(goal.x, goal.y, 4, goal.height);
  ctx.fillStyle = '#f2c14e';
  ctx.beginPath();
  ctx.moveTo(goal.x + 4, goal.y + 6);
  ctx.lineTo(goal.x + 44, goal.y + 18);
  ctx.lineTo(goal.x + 4, goal.y + 34);
  ctx.closePath();
  ctx.fill();
}

function drawCheckpoint() {
  const color = checkpoint.activated ? '#8effc0' : '#3a4a6a';
  ctx.fillStyle = color;
  ctx.fillRect(checkpoint.x, checkpoint.y, 4, checkpoint.height);
  ctx.beginPath();
  ctx.moveTo(checkpoint.x + 4, checkpoint.y + 4);
  ctx.lineTo(checkpoint.x + 26, checkpoint.y + 12);
  ctx.lineTo(checkpoint.x + 4, checkpoint.y + 20);
  ctx.closePath();
  ctx.fill();
}

function drawCoins() {
  for (const coin of coins) {
    if (coin.collected) continue;
    const bob = Math.sin((frameCount + coin.x) * 0.08) * 3;
    ctx.save();
    ctx.translate(coin.x, coin.y + bob);
    ctx.rotate(Math.PI / 4);
    ctx.fillStyle = '#5ee7ff';
    ctx.fillRect(-coin.size / 2, -coin.size / 2, coin.size, coin.size);
    ctx.strokeStyle = '#b6f6ff';
    ctx.lineWidth = 2;
    ctx.strokeRect(-coin.size / 2, -coin.size / 2, coin.size, coin.size);
    ctx.restore();
  }
}

// ============================================
// SHARED CHARACTER LIMBS
// The player and the spheres use the exact same limb art: two stick legs
// whose feet land on the ground line, and one muscular arm on the side the
// character is facing, rooted at the body's center.
// ============================================
const SKIN_FILL = '#e0a878';
const SKIN_LINE = '#b07d52';
const ARM_SCALE = 0.5;  // overall arm thickness — bicep bulge and fist scale together
const ARM_LENGTH = 0.5; // fraction of the full reach the arm actually extends

// Where the hand ends up, given a shoulder and the arm's full-reach target.
// Shared so anything held in the hand lines up with the drawn arm.
function armEnd(shoulderX, shoulderY, fistX, fistY) {
  return {
    x: shoulderX + (fistX - shoulderX) * ARM_LENGTH,
    y: shoulderY + (fistY - shoulderY) * ARM_LENGTH
  };
}

function drawStickLegs(hipY, groundY, swing) {
  ctx.strokeStyle = SKIN_LINE;
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-5, hipY);
  ctx.lineTo(-5 + swing * 0.3, groundY);
  ctx.moveTo(5, hipY);
  ctx.lineTo(5 - swing * 0.3, groundY);
  ctx.stroke();
}

function drawMuscleArm(shoulderX, shoulderY, fistX, fistY) {
  const end = armEnd(shoulderX, shoulderY, fistX, fistY);
  const len = Math.hypot(end.x - shoulderX, end.y - shoulderY);
  const angle = Math.atan2(end.y - shoulderY, end.x - shoulderX);
  const s = ARM_SCALE;

  ctx.save();
  ctx.translate(shoulderX, shoulderY);
  ctx.rotate(angle);
  ctx.fillStyle = SKIN_FILL;
  ctx.strokeStyle = SKIN_LINE;
  ctx.lineWidth = 1.5;

  // one tapered limb: narrow at the shoulder, bulging at the bicep,
  // tapering again to the wrist
  ctx.beginPath();
  ctx.moveTo(0, -4 * s);
  ctx.quadraticCurveTo(len * 0.32, -11 * s, len * 0.62, -5.5 * s);
  ctx.quadraticCurveTo(len * 0.85, -4 * s, len, -3 * s);
  ctx.lineTo(len, 3 * s);
  ctx.quadraticCurveTo(len * 0.85, 4 * s, len * 0.62, 5.5 * s);
  ctx.quadraticCurveTo(len * 0.32, 11 * s, 0, 4 * s);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // fist, kept in proportion to the bicep
  ctx.beginPath();
  ctx.arc(len, 0, 5 * s, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.restore();

  return { x: end.x, y: end.y, angle };
}

function drawEnemies() {
  for (const enemy of enemies) {
    if (!enemy.alive && enemy.squish <= 0) continue;
    const cx = enemy.x + enemy.w / 2;
    const cy = enemy.y + enemy.w / 2;
    const squashed = !enemy.alive;
    const scaleY = squashed ? Math.max(0.1, enemy.squish / 14) * 0.4 : 1;
    const isHopping = enemy.hopVY !== 0 || enemy.y !== enemy.baseY;
    const legLength = 8;
    const groundY = enemy.w / 2;          // bottom of the hitbox — the actual ground line
    const hipY = groundY - legLength;     // bottom of the body, where the legs attach

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(1, scaleY);

    // stick legs, reaching exactly to the ground line — tucked up mid-hop
    if (!squashed) {
      const legSwing = isHopping ? -6 : Math.sin((frameCount + enemy.x) * 0.3) * 5;
      const footY = isHopping ? hipY + 4 : groundY;
      drawStickLegs(hipY, footY, legSwing);
    }

    // the body sits on top of the legs, shifted up rather than sunk to the ground
    ctx.save();
    ctx.translate(0, -legLength);

    const grad = ctx.createRadialGradient(-enemy.w * 0.2, -enemy.w * 0.2, 2, 0, 0, enemy.w * 0.7);
    if (enemy.boss) {
      grad.addColorStop(0, enemy.awake ? '#ffd9a0' : '#ffb0c8');
      grad.addColorStop(1, enemy.awake ? '#8a1020' : '#7a1f45');
    } else {
      grad.addColorStop(0, '#ff9fc4');
      grad.addColorStop(1, '#a12d5c');
    }
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, enemy.w / 2, 0, Math.PI * 2);
    ctx.fill();

    // one muscular arm on the side it's travelling toward, rooted at the
    // sphere's center — exactly the same art as the player's
    if (!squashed) {
      const side = enemy.speed >= 0 ? 1 : -1;
      const r = enemy.w / 2;
      const hand = drawMuscleArm(0, -r * 0.1, side * (r + 17), -r * 0.35);

      // the boss whips out a chainsaw once it's awake
      if (enemy.boss && enemy.awake && cutscene !== 'done') {
        ctx.save();
        ctx.translate(hand.x, hand.y);
        ctx.scale(side, 1);

        // handle
        ctx.fillStyle = '#2d3340';
        ctx.fillRect(-4, -4, 10, 8);
        // bar
        ctx.fillStyle = '#9aa6bb';
        ctx.fillRect(5, -3, 22, 6);
        ctx.strokeStyle = '#5b6678';
        ctx.lineWidth = 1;
        ctx.strokeRect(5, -3, 22, 6);
        // spinning teeth
        ctx.fillStyle = '#e8eef8';
        const phase = (frameCount * 2.2) % 5;
        for (let tx = 5 + phase; tx < 27; tx += 5) {
          ctx.fillRect(tx, -5.5, 2.5, 2.5);
          ctx.fillRect(tx, 3, 2.5, 2.5);
        }
        // motion blur haze
        ctx.globalAlpha = 0.35;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(5, -5.5, 22, 1.5);
        ctx.fillRect(5, 4, 22, 1.5);
        ctx.restore();
      }
    }

    ctx.restore();
    ctx.restore();

    // surprise! a little exclamation bubble pops up above the body during the hop
    if (enemy.shout > 0) {
      const bubbleY = cy - legLength - enemy.w * 0.9;
      ctx.save();
      ctx.globalAlpha = Math.min(1, enemy.shout / 10);
      ctx.fillStyle = '#fffbe0';
      ctx.beginPath();
      ctx.arc(cx, bubbleY, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ff4d8d';
      ctx.font = 'bold 13px Trebuchet MS, Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('!', cx, bubbleY + 4);
      ctx.restore();
    }
  }
}

function drawMissiles() {
  for (const missile of missiles) {
    ctx.save();
    ctx.translate(missile.x, missile.y);
    ctx.scale(missile.dir, 1);
    ctx.fillStyle = '#8effc0';
    ctx.fillRect(-missile.w / 2, -missile.h / 2, missile.w, missile.h);
    ctx.fillStyle = '#ffdf7a';
    ctx.beginPath();
    ctx.moveTo(-missile.w / 2, -missile.h / 2);
    ctx.lineTo(-missile.w / 2 - 6, 0);
    ctx.lineTo(-missile.w / 2, missile.h / 2);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

function drawParticles() {
  for (const p of particles) {
    const maxLife = p.maxLife || 20;
    const baseSize = p.size || 6;
    const ratio = p.life / maxLife;
    const scale = p.shrink ? (p.easeShrink ? Math.sqrt(Math.max(0, ratio)) : ratio) : 1;
    const size = Math.max(1, baseSize * scale);
    ctx.save();
    ctx.globalAlpha = Math.max(0, ratio);
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rotate ? p.life * 0.3 : (p.angle || 0));
    ctx.fillStyle = p.color;
    ctx.fillRect(-size / 2, -size / 2, size, size);
    if (p.easeShrink) {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(-size / 2, -size / 2, size, size);
    }
    ctx.restore();
  }
}

function drawPlayer() {
  if (player.invincible > 0 && Math.floor(frameCount / 4) % 2 === 0) return;

  const moving = player.isOnGround && Math.abs(player.velocityX) > 0.6;
  const legSwing = moving ? Math.sin(frameCount * 0.5) * 14 : 4;
  const hw = player.width / 2;
  const hh = player.height / 2;
  const legLength = 9; // stick-leg length, measured down from the torso to the ground
  const groundY = hh;           // bottom of the hitbox — the actual ground line
  const hipY = hh - legLength;  // bottom of the torso, where the legs attach

  ctx.save();
  ctx.translate(player.x + player.width / 2, player.y + player.height / 2);

  // stick legs — the feet land exactly on the ground line, not past it
  drawStickLegs(hipY, groundY, legSwing);

  // the torso sits on top of the legs (shifted up by the leg length), not
  // sunk down to the ground itself
  ctx.save();
  ctx.translate(0, -legLength);

  ctx.fillStyle = '#f2c14e';
  ctx.fillRect(-hw, -hh, player.width, player.height);
  ctx.strokeStyle = '#c99a2e';
  ctx.lineWidth = 2;
  ctx.strokeRect(-hw, -hh, player.width, player.height);

  // one muscular arm on whichever side the character is facing, rooted at
  // the center of the square — the same art the spheres use
  const hand = drawMuscleArm(0, -hh * 0.1, player.facing * (hw + 17), -hh * 0.35);

  // the bazooka easter egg — held in the fist at the end of the arm
  if (player.weaponTimer > 0) {
    ctx.save();
    ctx.translate(hand.x, hand.y);
    ctx.scale(player.facing, 1);
    ctx.fillStyle = '#3a4a5c';
    ctx.fillRect(-4, -3, 20, 7);
    ctx.fillStyle = '#222c38';
    ctx.fillRect(12, -5, 8, 11);
    if (player.weaponTimer > 10) {
      ctx.fillStyle = 'rgba(255, 223, 122, 0.9)';
      ctx.beginPath();
      ctx.arc(22, 0, 6, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
  ctx.restore();
  ctx.restore();
}

function drawWorld() {
  ctx.save();
  ctx.translate(-camera.x, 0);
  drawPlatforms();
  drawCheckpoint();
  drawGoal();
  drawCoins();
  drawEnemies();
  drawMissiles();
  drawParticles();
  drawPlayer();
  drawPlayerShout();
  drawRescueNPC();
  ctx.restore();
}

function drawPlayerShout() {
  if (player.shout <= 0) return;
  const cx = player.x + player.width / 2;
  const cy = player.y - 14;
  ctx.save();
  ctx.globalAlpha = Math.min(1, player.shout / 10);
  ctx.fillStyle = '#fffbe0';
  ctx.beginPath();
  ctx.arc(cx, cy, 10, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ff4d8d';
  ctx.font = 'bold 15px Trebuchet MS, Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('!', cx, cy + 5);
  ctx.restore();
}

function drawRescueNPC() {
  if (!rescueNPC) return;
  const npc = rescueNPC;
  const hw = npc.width / 2;
  const hh = npc.height / 2;
  const legLength = 14;
  const groundY = hh;
  const hipY = groundY - legLength;
  const moving = npc.state === 'running' || npc.state === 'exit';
  const legSwing = moving ? Math.sin(frameCount * 0.5) * 14 : 4;

  ctx.save();
  ctx.translate(npc.x + hw, npc.y + hh);

  // stick legs
  drawStickLegs(hipY, npc.state === 'jumping' || npc.state === 'landing' ? hipY + 6 : groundY, legSwing);

  // body shifted up on the legs
  ctx.save();
  ctx.translate(0, -legLength);

  ctx.fillStyle = '#f2c14e';
  ctx.fillRect(-hw, -hh, npc.width, npc.height);
  ctx.strokeStyle = '#c99a2e';
  ctx.lineWidth = 3;
  ctx.strokeRect(-hw, -hh, npc.width, npc.height);

  // muscular arm
  drawMuscleArm(0, -hh * 0.1, npc.facing * (hw + 20), -hh * 0.35);

  ctx.restore();
  ctx.restore();
}

function drawHUD() {
  ctx.fillStyle = '#e8ecf7';
  ctx.font = 'bold 16px Trebuchet MS, Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('SCORE  ' + score, 14, 26);

  for (let i = 0; i < lives; i++) {
    ctx.fillStyle = '#f2c14e';
    ctx.fillRect(VIEW_WIDTH - 30 - i * 26, 12, 16, 16);
  }

  if (toast.timer > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, toast.timer / 30);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#8effc0';
    ctx.font = 'bold 15px Trebuchet MS, Arial, sans-serif';
    ctx.fillText(toast.text, VIEW_WIDTH / 2, 46);
    ctx.restore();
  }

  if (muted) {
    ctx.textAlign = 'right';
    ctx.fillStyle = '#7a84a8';
    ctx.font = '12px Trebuchet MS, Arial, sans-serif';
    ctx.fillText('muted', VIEW_WIDTH - 14, VIEW_HEIGHT - 12);
  }
}

function drawOverlay(title, sub1, sub2, accent) {
  ctx.fillStyle = 'rgba(10, 13, 28, 0.85)';
  ctx.fillRect(0, 0, VIEW_WIDTH, VIEW_HEIGHT);

  ctx.textAlign = 'center';
  ctx.fillStyle = accent;
  ctx.font = 'bold 40px Trebuchet MS, Arial, sans-serif';
  ctx.fillText(title, VIEW_WIDTH / 2, VIEW_HEIGHT / 2 - 30);

  ctx.fillStyle = '#e8ecf7';
  ctx.font = '16px Trebuchet MS, Arial, sans-serif';
  ctx.fillText(sub1, VIEW_WIDTH / 2, VIEW_HEIGHT / 2 + 10);

  ctx.fillStyle = '#7a84a8';
  ctx.font = '13px Trebuchet MS, Arial, sans-serif';
  ctx.fillText(sub2, VIEW_WIDTH / 2, VIEW_HEIGHT / 2 + 36);
}

function drawTitleDecor() {
  ctx.save();
  ctx.fillStyle = 'rgba(255, 77, 141, 0.25)';
  ctx.beginPath();
  ctx.arc(560, 340, 30, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(620, 300, 20, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = 'rgba(242, 193, 78, 0.35)';
  ctx.fillRect(200, 330, 28, 28);
  ctx.fillRect(240, 300, 20, 20);
  ctx.restore();
}

function draw() {
  drawBackground();

  if (gameState === 'title') {
    drawTitleDecor();
    drawOverlay(
      'BLOCK BASH',
      'The smooth spheres have come to sand the corners off everything.',
      'Press SPACE or ENTER to defend your world',
      '#f2c14e'
    );
    return;
  }

  drawWorld();
  drawHUD();

  if (gameState === 'win') {
    drawOverlay('LEVEL CLEAR', 'The squares hold their ground. Final score: ' + score, 'Press R to play again', '#5ee7ff');
  } else if (gameState === 'gameover') {
    drawOverlay('ROUNDED OUT', 'The spheres got the better corner this time. Score: ' + score, 'Press R to try again', '#ff4d8d');
  }
}

// ============================================
// GAME LOOP
// ============================================
function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
