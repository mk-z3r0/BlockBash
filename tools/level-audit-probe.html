<!DOCTYPE html>
<html><body style="margin:0;background:#000;">
<canvas id="game" width="800" height="450"></canvas>
<pre id="out">running…</pre>
<script>localStorage.setItem('blockbash-save', JSON.stringify({ saveVersion: 1, furthestLevelIndex: 0, bestScore: 0, hasSeenIntro: true, narrative: { seenCutscenes: {}, npcStage: 0, flags: {} } })); window.__errs=[];window.addEventListener('error',e=>window.__errs.push('ERROR: '+(e.message||e.error)));</script>
<script type="module" src="../src/main.js"></script>
<script type="module">
  // Per-obstacle audit of a level: is every gap and every jumpable spike bed
  // actually clearable, and does the geometry obey the level design rules?
  //
  //   ?level=N     which level index to audit (default 0)
  //
  // This is the gate an authored level has to pass, and it replaced a
  // whole-level autoplay bot that turned out to be useless as a gate: that
  // bot dies ~70 times on level 1, which is FINISHED and tuned, for reasons
  // gap-probe.html already documents as bot precision rather than unfair
  // geometry. Testing one obstacle at a time from a clean runway is the
  // instrument that actually measures the level instead of the bot.
  //
  // Everything here is adapted from tools/gap-probe.html, which did exactly
  // this for level 1 only, with the pass/fail and the structural rules added.
  import { player } from '../src/entities/player.js';
  import { state } from '../src/state.js';
  import { update, switchTo } from '../src/scenes/sceneManager.js';
  import { getLevel } from '../src/levels/levelLoader.js';
  import { levels } from '../src/levels/registry.js';
  import { P } from '../src/engine/physics.js';

  const params = new URLSearchParams(location.search);
  const levelIndex = parseInt(params.get('level') || '0', 10);
  const key = (t, k) => document.dispatchEvent(new KeyboardEvent(t, { key: k }));
  const out = [];
  let failures = 0, warnings = 0;
  const fail = msg => { failures++; out.push('  FAIL ' + msg); };
  // Advisory only. A warning is something the design rules discourage that
  // level 1 nonetheless ships and playtests fine with, so failing a level
  // over it would make this gate lie.
  const warn = msg => { warnings++; out.push('  warn ' + msg); };

  setTimeout(() => {
    if (levelIndex >= levels.length) {
      document.getElementById('out').textContent =
        `*** FAIL no level at index ${levelIndex} (registry has ${levels.length})\nerrors: none`;
      return;
    }
    state.currentLevelIndex = levelIndex;
    switchTo('playing', { retry: true });

    const lv = getLevel();
    lv.cutscenes.length = 0;   // a dialogue beat would wait for a keypress
    const ground = lv.platforms.filter(p => p.ground).sort((a, b) => a.x - b.x);
    // Ground is no longer one flat line: segments can sit above the level's
    // base. Every test has to stand the player on the surface that's
    // actually there, or it drops them through a terrace and calls the
    // level broken.
    const groundYAt = x => {
      const seg = ground.find(p => x >= p.x && x <= p.x + p.width);
      return seg ? seg.y : lv.groundY;
    };
    const floating = lv.platforms.filter(p => !p.ground && p.width > 1);

    function place(x, y) {
      player.x = x; player.y = y;
      player.velocityX = 0; player.velocityY = 0;
      // Never a "safety" value: the hazard-death check is itself gated on
      // invincible<=0, so anything above zero silently makes spikes
      // harmless and every measurement below meaningless. This exact trap
      // invalidated a whole earlier pass — see the level design rules.
      player.invincible = 0;
      player.isOnGround = false;
      // Arrive at speed, with the P-meter already full.
      //
      // Starting each test from a dead stop was the first version and it
      // reported two of level 1's small spike beds as uncrossable, which
      // they demonstrably are not. The reason is runway: the bed at 5700
      // sits 108px into its ground segment, and 108px from standing isn't
      // enough to reach the run cap — but a real player arrives there
      // already moving, having crossed the whole stretch before it. The
      // test has to model arrival, not a standing start, or it measures
      // the runway rather than the obstacle.
      player.velocityX = primedSpeed;
      player.pMeter = P.pMeterSegments;
      state.lives = 99;
      // Nudge the clock by a prime between tests so successive attempts at
      // the same obstacle meet any moving platform at a different phase.
      // A level's movers are somewhere different every frame, and an
      // obstacle near one would otherwise be judged against a single
      // arbitrary snapshot of the room. Sampling across the matrix is also
      // the honest test: the player can stand on the ledge and wait for the
      // platform, so "clearable at some phase" is what clearable means.
      state.frameCount += 53;
    }
    let primedSpeed = P.runMax;
    const clearEnemies = () => state.enemies.forEach(e => { e.alive = false; });

    function runwayStart(triggerX, segStart) {
      const prevHazardEnd = lv.hazards
        .filter(h => h.x + h.width < triggerX)
        .reduce((m, h) => Math.max(m, h.x + h.width + 12), 0);
      let start = Math.max(segStart + 2, prevHazardEnd, triggerX - 300);
      // ...and never inside a solid block sitting ON the ground. Level 1's
      // staircase (2990-3222) is exactly this case: a runway that began at
      // 3200 put the player inside a tread, where they pressed right into a
      // wall for 300 frames and the test reported "no result" for a gap
      // that is perfectly clearable. Walk the runway forward past anything
      // solid it starts inside of.
      for (const p of floating) {
        // Against the LOCAL ground, not the level's base line. A block
        // standing on a raised shelf has its bottom at the shelf, nowhere
        // near groundY — comparing to groundY meant every cover block on
        // level 4's shelf went unrecognised, so runways started inside them
        // and the player spent the whole test pressed against a wall. That
        // reported a perfectly ordinary 150px gap as impossible.
        const standsOnGround = p.y + p.height >= groundYAt(p.x) - 2;
        if (standsOnGround && start >= p.x - player.width && start <= p.x + p.width) {
          start = p.x + p.width + 4;
        }
      }
      // Never clamp back INTO a hazard. The "leave at least 60px of runway"
      // clamp could undo the "start after the previous spike bed" guard and
      // place the player standing in spikes, which then read as the obstacle
      // being uncrossable — level 7 had a bed ending 50px before a gap and
      // this reported the gap as impossible. If a level really does leave
      // almost no runway between two obstacles, that is a fact about the
      // level and the test should show it rather than paper over it.
      return Math.max(prevHazardEnd, Math.min(start, triggerX - 60));
    }

    // Where a player could plausibly be standing when they commit to this
    // obstacle. Running along the ground is one answer; in a level built out
    // of columns it is very often NOT the answer, because there is no runway
    // between the pillar and the bed and the whole point is to jump off the
    // pillar.
    //
    // This was the single biggest blind spot in the audit. Level 3 is a
    // forest of standing blocks, and testing only the ground runway reported
    // all twelve of its spike beds as uncrossable when every one of them is
    // cleared comfortably from the stump in front of it.
    function launchPoints(triggerX, fromX) {
      const runX = runwayStart(triggerX, fromX);
      const points = [{ x: runX, y: groundYAt(runX), label: 'ground' }];
      // A solid block standing ON the ground whose top the player could be
      // on when they jump — near enough to the obstacle to be the obvious
      // launch pad, and high enough to be worth climbing.
      for (const p of floating) {
        const standsOnGround = p.y + p.height >= groundYAt(p.x) - 2;
        const endsBefore = p.x + p.width;
        if (!standsOnGround) continue;
        if (endsBefore > triggerX + 2 || endsBefore < triggerX - 170) continue;
        points.push({ x: p.x + p.width - player.width - 2, y: p.y, label: `off the block at ${p.x}` });
      }
      return points;
    }

    function jumpTest(triggerX, fromX, targetX, lead, hold, run, from) {
      // A launch off a narrow pillar top can't be at full run — there's no
      // room on it to accelerate. Ground runways get whatever speed is asked
      // for; block launches are capped at walk, which is the conservative
      // reading and the one that can't flatter a level.
      primedSpeed = (run && from.label === 'ground') ? P.runMax : P.walkMax;
      const startX = from.x;
      place(startX, from.y - player.height);
      clearEnemies();
      const lives0 = state.lives;
      key('keydown', 'ArrowRight');
      if (run) key('keydown', 'Shift');
      let jumped = false, h = 0, res = 'no result';
      for (let i = 0; i < 300; i++) {
        if (!jumped && player.isOnGround && player.x + player.width >= triggerX - lead) {
          key('keydown', ' '); jumped = true; h = hold;
        }
        if (h > 0 && --h === 0) key('keyup', ' ');
        update();
        if (state.lives < lives0) { res = 'DIED'; break; }
        if (jumped && player.isOnGround && player.x > targetX) { res = `ok +${Math.round(player.x - targetX)}`; break; }
      }
      key('keyup', ' '); key('keyup', 'ArrowRight'); key('keyup', 'Shift');
      return res;
    }

    // Timings a real player might use, at BOTH speeds. An obstacle passes
    // if any one of them clears it.
    //
    // Testing run only was wrong, and level 1 proved it: its 35px and 50px
    // beds at 5700 and 5850 sit 115px apart, so a full-power run jump off
    // the first lands within a few px of the second. They're walk-speed
    // obstacles. The design rules are explicit that walk and run are two
    // different skills rather than one being strictly better, so a gate
    // that only measures run declares hand-tuned, shipped geometry broken.
    const TIMINGS = [['edge+long', 0, 22], ['early+long', 45, 22], ['edge+short', 0, 8]];
    const STYLES = [];
    for (const run of [true, false]) {
      for (const [n, l, h] of TIMINGS) STYLES.push([`${run ? 'run' : 'walk'}/${n}`, l, h, run]);
    }
    const anyOk = results => results.some(r => r.startsWith('ok'));

    // --- how much room for error the obstacle leaves -------------------
    //
    // "Is it clearable" and "is it fair" are different questions, and this
    // gate only ever answered the first. An obstacle with exactly one
    // working timing IS clearable, and it is also a precision jump that a
    // ten-year-old will die on twenty times.
    //
    // The first attempt at measuring this counted how many of the six
    // canned timings above cleared each obstacle, and it was worthless:
    // level 1's beds mostly score 2/6 while clearing by 130px, because
    // "edge+short" is a hop that clears nothing and "early+long" jumps from
    // so far back that it lands short. Two crude samples of a wide window
    // look identical to two lucky hits on a narrow one.
    //
    // What actually decides whether a jump is fair is HOW PRECISELY the
    // button has to be pressed. So sweep the take-off point: jump from
    // every position in a band before the obstacle and count the ones that
    // survive. The answer comes back in pixels of run-up — "you can press
    // jump anywhere in a 60px stretch" — which is both the thing the player
    // experiences and a number a level author can act on.
    const SWEEP_LEADS = [0, 8, 16, 24, 32, 40, 48, 56, 64, 72, 80];
    const SWEEP_STEP = 8;
    // Calibrated against level 1, which is finished and hand-playtested.
    // Its narrowest obstacle is the 160px bed at 4320 (see the numbers in
    // the level design rules); nothing there comes in under 24px of window,
    // so that is what the rest of the game has to match.
    const MIN_WINDOW = 24;
    const tight = [];

    // The widest CONTIGUOUS band of take-off positions that clears it, at
    // either speed, from any launch point. Contiguous matters: three
    // scattered leads that work with failures between them is not a window,
    // it's three coincidences, and a player cannot aim at it.
    function timingWindow(triggerX, fromX, targetX, froms) {
      let best = 0, bestLabel = '';
      for (const from of froms) {
        for (const run of [true, false]) {
          let runLen = 0;
          for (const lead of SWEEP_LEADS) {
            const ok = jumpTest(triggerX, fromX, targetX, lead, 22, run, from).startsWith('ok');
            runLen = ok ? runLen + 1 : 0;
            if (runLen * SWEEP_STEP > best) {
              best = runLen * SWEEP_STEP;
              bestLabel = `${run ? 'run' : 'walk'}${from.label === 'ground' ? '' : ' ' + from.label}`;
            }
          }
        }
      }
      return { px: best, how: bestLabel };
    }

    function gradeObstacle(what, results, triggerX, fromX, targetX, froms) {
      const oks = results.filter(r => r.startsWith('ok'));
      if (!oks.length) return { ways: 0, of: results.length, window: 0, how: '' };
      const w = timingWindow(triggerX, fromX, targetX, froms);
      if (w.px < MIN_WINDOW) {
        tight.push(`${what} — only a ${w.px}px window to take off in` +
                   (w.how ? ` (best: ${w.how})` : ''));
      }
      return { ways: oks.length, of: results.length, window: w.px, how: w.how };
    }
    // Only the timings that worked, so a passing line stays readable.
    // Results come back as launch points x timings, flattened. Only the ones
    // that worked are printed, so a passing line stays readable.
    const summarise = (results, froms) => {
      const ok = [];
      results.forEach((r, i) => {
        if (!r.startsWith('ok')) return;
        const from = froms[Math.floor(i / STYLES.length)];
        const style = STYLES[i % STYLES.length][0];
        ok.push(`${from.label === 'ground' ? '' : from.label + ' '}${style}:${r}`);
      });
      return ok.length ? ok.slice(0, 6).join('  ') + (ok.length > 6 ? `  (+${ok.length - 6} more)` : '')
                       : 'NOTHING CLEARS IT';
    };

    out.push(`== LEVEL ${levelIndex}: ${lv.name} ==`);

    // ---- gaps ----
    const gaps = [];
    ground.forEach((s, i) => {
      if (i === 0) return;
      const prev = ground[i - 1], edge = prev.x + prev.width;
      if (s.x - edge > 2) {
        gaps.push({
          edge, landing: s.x, size: s.x - edge, from: prev.x,
          // Positive = the far side is HIGHER. A gap that also climbs costs
          // part of the jump's carry, so it's worth seeing in the report.
          rise: prev.y - s.y
        });
      }
    });
    out.push(`== GAPS (${gaps.length}) ==`);
    gaps.forEach(g => {
      const froms = launchPoints(g.edge, g.from);
      const results = [];
      for (const from of froms) {
        for (const [, l, h, run] of STYLES) results.push(jumpTest(g.edge, g.from, g.landing, l, h, run, from));
      }
      const climb = g.rise ? `  ${g.rise > 0 ? '+' : ''}${g.rise}px step` : '';
      const d = gradeObstacle(`gap ${g.edge}-${g.landing} (${g.size}px)`, results, g.edge, g.from, g.landing, froms);
      out.push(`  ${g.edge}-${g.landing} (${g.size}px)${climb}  [window ${d.window}px]  ${summarise(results, froms)}`);
      if (!anyOk(results)) fail(`gap ${g.edge}-${g.landing} (${g.size}px) is not clearable at any tested speed or timing`);
    });

    // ---- spike beds ----
    // Anything over 200px wide is meant to be crossed on platforms rather
    // than jumped (level 1's long bed is the reference case), so it's
    // checked for stepping stones instead of for clearance.
    out.push('== SPIKE BEDS ==');
    lv.hazards.forEach(hz => {
      const seg = ground.find(p => hz.x >= p.x && hz.x <= p.x + p.width);
      if (!seg) { out.push(`  ${hz.x} (${hz.width}px): floating hazard, not audited`); return; }
      if (hz.width > 200) {
        const stones = floating.filter(p => p.x + p.width > hz.x && p.x < hz.x + hz.width);
        out.push(`  ${hz.x}-${hz.x + hz.width} (${hz.width}px): crossed on ${stones.length} platform(s)`);
        if (stones.length === 0) {
          fail(`spike bed ${hz.x}-${hz.x + hz.width} is ${hz.width}px wide (> 200) with no platform over it to cross on`);
        } else if (stones.length === 1) {
          // Level 1 crosses its 340px bed on TWO stones, and that's the
          // shape to copy. One platform in the middle of a wide bed means
          // two long committed jumps with spikes under both and nowhere to
          // stop and re-time between them — survivable, but a different
          // and much meaner obstacle than it looks.
          warn(`spike bed ${hz.x}-${hz.x + hz.width} (${hz.width}px) is crossed on a single platform — two stones is the fair shape`);
        }
        return;
      }
      const froms = launchPoints(hz.x, seg.x);
      const results = [];
      for (const from of froms) {
        for (const [, l, h, run] of STYLES) results.push(jumpTest(hz.x, seg.x, hz.x + hz.width, l, h, run, from));
      }
      const d = gradeObstacle(`spike bed ${hz.x}-${hz.x + hz.width} (${hz.width}px)`, results, hz.x, seg.x, hz.x + hz.width, froms);
      out.push(`  ${hz.x}-${hz.x + hz.width} (${hz.width}px)  [window ${d.window}px]  ${summarise(results, froms)}`);
      if (!anyOk(results)) fail(`spike bed ${hz.x}-${hz.x + hz.width} (${hz.width}px) is not clearable at any tested speed or timing`);
    });

    // ---- structural rules, checked statically ----
    // "Never put a platform directly above a jump-off point. The player
    // rises into it and a correctly-timed jump becomes a death. This caused
    // the worst bug in level 1."
    out.push('== STRUCTURE ==');
    const JUMP_RISE = 225;      // measured, see the level design rules
    const surfaceAt = x => groundYAt(x);
    const LIP = 40;             // how much of the take-off lip counts as the jump-off point
    // Only gaps that actually demand a committed jump. Level 1 has a 25px
    // gap directly under a wide platform and is completely fine, because a
    // gap that narrow is crossed with a hop or simply run over — the rule
    // is about full-power jumps, so the check has to be too.
    const NEEDS_REAL_JUMP = 45;
    // Spike beds have take-off lips too, and that's how this check earned
    // its keep: level 2 was authored with a bed at 2400 directly under the
    // platform at 2300-2420, which only the jump tests caught because this
    // rule was originally written for gaps alone.
    const lips = [
      ...gaps.filter(g => g.size > NEEDS_REAL_JUMP).map(g => ({ x: g.edge, what: `the gap at ${g.edge}` })),
      ...lv.hazards.filter(h => h.width <= 200).map(h => ({ x: h.x, what: `the spike bed at ${h.x}` }))
    ];
    let overhead = 0;
    lips.forEach(lip => {
      floating.forEach(p => {
        // Authored position, not wherever it has drifted to: a moving
        // platform is somewhere different every frame, and a structural rule
        // that reports "platform 2901.563332790057" is measuring the clock.
        const px = p.baseX == null ? p.x : p.baseX;
        const py = p.baseY == null ? p.y : p.baseY;
        const overLip = px < lip.x + 4 && px + p.width > lip.x - LIP;
        const floor = surfaceAt(lip.x);
        // A solid block standing on the ground can't be "overhead" — there
        // is no under it to rise into. It's terrain to climb, and in a
        // pillar level it's usually the intended launch pad.
        if (py + p.height >= groundYAt(px) - 2) return;
        const withinRise = py + p.height > floor - JUMP_RISE && py < floor - player.height;
        if (overLip && withinRise) {
          overhead++;
          // Advisory, because this rule cannot see horizontal travel and
          // the jump tests above can. A platform 40px back from a lip is
          // often cleared comfortably: by the time the player has risen to
          // its underside they have already moved past it. The simulation
          // is authoritative — a genuine bonk shows up there as DIED or as
          // NOTHING CLEARS IT, which is how level 2's bed at 2400 was
          // caught. This is the pointer at geometry worth a second look.
          warn(`platform ${px}-${px + p.width} @y${py} is close over the take-off for ${lip.what} — the jump tests above are the verdict`);
        }
      });
    });
    if (!overhead) out.push(`  no platform overhangs any take-off lip (${lips.length} checked)`);

    // "Keep landing zones clear of the next hazard. A hard jump carries
    // 162px — don't let a full-power leap off a pit land in spikes."
    let badLanding = 0;
    gaps.forEach(g => {
      const hz = lv.hazards.find(h => h.x >= g.landing && h.x < g.landing + 70);
      if (hz) { badLanding++; fail(`spikes at ${hz.x} sit only ${hz.x - g.landing}px past the landing of the gap at ${g.edge}-${g.landing}`); }
    });
    if (!badLanding) out.push('  every gap landing is clear of the next hazard');

    // ...and the mirror of that rule, which cost two diagnosis passes on
    // level 6 before it existed. A jumpable bed near the END of its ground
    // segment is a trap: clearing it at run carries ~168px, so if the ledge
    // is right there the correct answer to the hazard is a death in the pit
    // after it. The bed reads as fine in isolation and the gap reads as fine
    // in isolation; only the pair is wrong.
    let bedOffLedge = 0;
    lv.hazards.forEach(h => {
      if (h.width > 200) return;
      const seg = ground.find(p => h.x >= p.x && h.x <= p.x + p.width);
      if (!seg) return;
      const runOut = (seg.x + seg.width) - (h.x + h.width);
      if (runOut < 90) {
        bedOffLedge++;
        fail(`spike bed ${h.x}-${h.x + h.width} leaves only ${runOut}px of ground before the ledge at ${seg.x + seg.width} — clearing it lands in the pit`);
      }
    });
    if (!bedOffLedge) out.push('  every spike bed has ground to land on after it');

    // ...and the version of that rule for levels built out of standing
    // blocks rather than pits. A pillar counts as the end of the floor just
    // as much as a ledge does: clearing a bed into a 60px slot with spikes
    // behind you and a wall in front is not a landing, it's a trap you have
    // to jump straight back out of from a standstill.
    //
    // This is what level 3 was actually doing wrong. Its take-off windows
    // measure fine — the obstacle you aim at is reachable — but every one of
    // them lands you in a gap between a spike bed and the next column, and
    // the audit had no way to see that because it only ever asked whether
    // the player got PAST the hazard.
    const RECOVERY = 70;        // room to stop, turn, and set up the next jump
    let cramped = 0;
    lv.hazards.forEach(h => {
      if (h.width > 200) return;
      const seg = ground.find(p => h.x >= p.x && h.x <= p.x + p.width);
      if (!seg) return;
      const landAt = h.x + h.width;
      // The nearest thing that stops a player who has just landed: a block
      // standing on this floor, or the next spike bed.
      let blocker = seg.x + seg.width, what = `the ledge at ${seg.x + seg.width}`;
      floating.forEach(p => {
        const px = p.baseX == null ? p.x : p.baseX;
        if (p.y + p.height < groundYAt(px) - 2) return;   // not standing on the floor
        if (px >= landAt && px < blocker) { blocker = px; what = `the column at ${px}`; }
      });
      lv.hazards.forEach(o => {
        if (o === h) return;
        if (o.x >= landAt && o.x < blocker) { blocker = o.x; what = `the spikes at ${o.x}`; }
      });
      const room = blocker - landAt;
      if (room < RECOVERY) {
        cramped++;
        warn(`spike bed ${h.x}-${landAt} lands you in ${room}px of floor before ${what} — under ${RECOVERY}px there is no room to set up the next jump`);
      }
    });
    if (!cramped) out.push(`  every spike bed landing has ${RECOVERY}px+ of floor to recover on`);

    // How wide the tops are that the level expects to be landed on. The
    // player is 22px; a 54px column leaves 32px of slack, and a chain of
    // those is a precision platforming level, which this game is not.
    const MIN_TOP = 70;
    const narrow = floating
      .filter(p => p.width < MIN_TOP)
      .map(p => `${p.baseX == null ? p.x : p.baseX} (${p.width}px wide)`);
    if (narrow.length) warn(`${narrow.length} landing surface(s) under ${MIN_TOP}px wide: ${narrow.slice(0, 8).join(', ')}${narrow.length > 8 ? ' …' : ''}`);
    else out.push(`  every landing surface is at least ${MIN_TOP}px wide`);

    // A checkpoint inside an enemy's patrol span means respawning into a
    // sphere, which the design rules call a cheap death.
    // Measured against what an enemy can actually REACH, not just where it
    // walks. A pursuer breaks patrol at 230px and an aggressor shoots from
    // 330 (entities/enemy.js), so a checkpoint 100px outside a shooter's
    // patrol is still somewhere you respawn and get shot standing still.
    // The old ±30 only knew about patrol spans and passed five checkpoints
    // that tools/respawn-state-probe.html then proved were fatal.
    // Octagons are not on the tier ladder — they shamble at anything within
    // 200px regardless of what `tier` says (entities/enemy.js), so a table
    // keyed only on tier reported a checkpoint standing inside a corrupted
    // square's reach as clean.
    const REACH = { passive: 30, pursuer: 240, aggressor: 340 };
    const reachOf = s => (s.kind === 'octagon' ? 210 : (REACH[s.tier || 'passive'] || 30));
    let badCheckpoint = 0;
    (lv.checkpoints || []).forEach(c => {
      const e = (lv.enemySpawns || []).find(s => {
        if (s.boss) return false;
        const r = reachOf(s);
        return c.x > s.minX - r && c.x < s.maxX + r;
      });
      // Advisory: respawning grants P.RESPAWN_INVINCIBLE_FRAMES, which is
      // what lets level 1 ship two of these without it reading as a cheap
      // death. Still worth not doing on purpose.
      if (e) { badCheckpoint++; warn(`checkpoint at ${c.x} is inside the reach of the ${e.kind === 'octagon' ? 'octagon' : (e.tier || 'passive')} at ${e.x} (${e.minX}-${e.maxX})`); }
    });
    if (!badCheckpoint) out.push('  no checkpoint is inside an enemy\'s reach');

    // ---- can the player get on it at all? ----
    //
    // Reported from play: "many of the platforms moving up and down are
    // unreachable." They were, and so were a lot of the static ones, and
    // nothing here could see it because this probe had only ever asked
    // about gaps and spike beds — the things that kill you — never about
    // the things you are supposed to be able to stand on.
    //
    // The number that matters had also been wrong in the docs for a long
    // time. The level design rules said the jump "rises ~225px"; measured
    // in clear air (it matters that it's clear air — the first attempt at
    // this measured a head bonk) the player's FEET rise 97px from a stand,
    // 107 at walk and 117 at a full run. A platform whose top is 160px
    // above the floor is not a hard jump, it is not a jump.
    const RISE_RUN = 117;
    const RISE_WALK = 107;
    // Horizontal reach, from the same measurements the rest of this file
    // uses. Generous on purpose: this is a "could anyone ever" test, and
    // the jump tests above are what judge anything marginal.
    const CARRY = P.runMax > 0 ? 168 : 168;

    out.push('== REACH ==');
    {
      // Every surface that can be stood on, with the height it offers. A
      // mover is taken at its LOWEST point, which is where it's boarded.
      // A platform is BOARDED at its lowest point and DELIVERS you to its
      // highest. For a static one those are the same; for anything that
      // travels they are not, and treating a lift as if it stayed at the
      // bottom concludes that an arena reached by riding one is unreachable.
      // `move` is the clock-driven kind, `mover` the boss-driven kind — both
      // rise from their authored y.
      const travelOf = p => (p.move && p.move.y) || p.mover || 0;
      const surfaces = [
        ...ground.map(g => ({ x: g.x, x2: g.x + g.width, y: g.y, top: g.y, what: 'the floor' })),
        ...floating.map(p => {
          const bx = p.baseX == null ? p.x : p.baseX;
          const by = p.baseY == null ? p.y : p.baseY;
          const travel = travelOf(p);
          return { x: bx, x2: bx + p.width, y: by, top: by - travel,
                   what: `the platform at ${bx}`, mover: travel > 0 };
        })
      ];
      const reached = new Set(ground.map(g => g.x));
      // Repeated passes, because standing on one platform can put another
      // in range — which is how most of level 5's high route is meant to
      // work.
      for (let pass = 0; pass < 6; pass++) {
        for (const s of surfaces) {
          if (reached.has(s.x)) continue;
          const from = surfaces.find(o => {
            if (!reached.has(o.x)) return false;
            if (o === s) return false;
            const rise = o.top - s.y;                     // how far up, from its highest
            if (rise > RISE_RUN) return false;
            // Horizontally in range: overlapping, or within a jump's carry.
            const gap = s.x > o.x2 ? s.x - o.x2 : (o.x > s.x2 ? o.x - s.x2 : 0);
            return gap <= CARRY;
          });
          if (from) reached.add(s.x);
        }
      }
      const orphans = surfaces.filter(s => !reached.has(s.x));
      if (!orphans.length) {
        out.push(`  every one of the ${surfaces.length - ground.length} platforms can be got onto`);
      } else {
        orphans.forEach(o => {
          const floor = groundYAt(o.x + 4);
          fail(`${o.what} (top y${o.y}${o.mover ? ', at its lowest' : ''}) is ${Math.round(floor - o.y)}px above the floor` +
               ` and nothing in range reaches it — the jump gains ${RISE_RUN}px at a full run`);
        });
      }
    }

    // ---- fairness ----
    // Separate from the clearable/not-clearable gate above and reported
    // separately, because they are different failures with different fixes:
    // an unclearable obstacle is broken, a tight one plays badly.
    out.push('== ROOM FOR ERROR ==');
    if (!tight.length) {
      out.push(`  every obstacle leaves at least a ${MIN_WINDOW}px stretch to take off from`);
    } else {
      tight.forEach(t => fail(`TIGHT ${t}`));
    }

    out.push(failures
      ? `*** ${failures} FAILURE(S)${warnings ? `, ${warnings} warning(s)` : ''}`
      : `PASS all obstacles clearable, structure clean${warnings ? ` (${warnings} warning(s))` : ''}`);
    out.push('errors: ' + (window.__errs.length ? window.__errs.join(' | ') : 'none'));
    document.getElementById('out').textContent = out.join('\n');
  }, 250);
</script></body></html>
