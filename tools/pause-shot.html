<!DOCTYPE html>
<html><body style="margin:0;background:#0a0d1c;">
<script>localStorage.setItem('blockbash-save', JSON.stringify({ saveVersion: 1, furthestLevelIndex: 0, bestScore: 0, hasSeenIntro: true }));</script>
<canvas id="game" width="800" height="450"></canvas>
<script type="module" src="../src/main.js"></script>
<script type="module">
  import { update } from '../src/scenes/sceneManager.js';
  const key = (t, k) => document.dispatchEvent(new KeyboardEvent(t, { key: k }));
  setTimeout(() => {
    key('keydown', ' '); key('keyup', ' '); // title -> playing
    key('keydown', 'ArrowRight'); key('keyup', 'ArrowRight');
    for (let i = 0; i < 40; i++) update();
    key('keydown', 'Escape'); key('keyup', 'Escape'); // pause
    for (let i = 0; i < 5; i++) update();
  }, 150);
</script></body></html>
