<!DOCTYPE html>
<html><body style="margin:0;background:#000;">
<canvas id="game" width="800" height="450"></canvas><pre id="out">running…</pre>
<script>localStorage.setItem('blockbash-save', JSON.stringify({ saveVersion: 1, furthestLevelIndex: 0, bestScore: 0, hasSeenIntro: true, narrative: { seenCutscenes: {}, npcStage: 0, flags: {} } })); window.__errs=[];window.addEventListener('error',e=>window.__errs.push('ERROR: '+(e.message||e.error)));</script>
<script type="module" src="../src/main.js"></script>
<script type="module">
  // Every fightable boss, driven through its own state machine by hand.
  //
  // What this is actually protecting: a boss that can never be hurt, or one
  // that can be hurt at the wrong time, is a level the player cannot finish
  // — and the boss body-blocks the way to the world's edge, so "can't beat
  // it" and "can't leave" are the same bug. Each one is checked for having
  // a real closed window and a real open one, and for dropping what it owes.
  import { player } from '../src/entities/player.js';
  import { state } from '../src/state.js';
  import { update, switchTo } from '../src/scenes/sceneManager.js';
  import { hasFooting } from '../src/levels/levelLoader.js';
  import { getLevel } from '../src/levels/levelLoader.js';
  import { levels } from '../src/levels/registry.js';
  import { startAttack } from '../src/weapons/combat.js';
  import { getWeapon } from '../src/weapons/registry.js';

  const out = [];
  let fails = 0;
  const check = (ok, label) => { if (!ok) fails++; out.push(`  ${ok ? 'ok  ' : 'FAIL'} ${label}`); };

  // Stand the player right next to the boss and swing until the cooldown
  // lets another one through. Returns how much hp came off.
  function swingAt(boss, times) {
    const before = boss.hp;
    for (let n = 0; n < times; n++) {
      player.x = boss.x - player.width - 6;
      player.y = boss.y;
      player.facing = 1;
      player.weaponCooldown = 0;
      startAttack(player);
      const w = getWeapon(player.weapon);
      for (let f = 0; f < w.duration + 2; f++) update();
    }
    return before - boss.hp;
  }

  const tick = n => { for (let i = 0; i < n; i++) update(); };

  // --- is it ANIMATED? ---------------------------------------------------
  //
  // Reported from play twice — "the boss' weapon isn't visible", then "the
  // level 2 boss is swinging the drill like a pickaxe" — and both times the
  // fix was a drawing change that nothing could hold in place afterwards.
  // Every fightable boss in the game spent its whole fight in one frozen
  // idle pose, and no probe could tell, because a boss that never moves its
  // arms fights exactly as well as one that does.
  //
  // So: watch the visual state the phase machine owns, and require it to
  // change. `posePhase` is the held point in the weapon's own swing,
  // `mining`/`strain`/`conducting` are the per-boss poses, and a live
  // `weaponTimer` is a real swing in progress. A boss that shows only one
  // distinct value across four hundred frames of its own fight is standing
  // still, whatever its hp bar is doing.
  function poseSamples(boss, frames = 400) {
    const seen = new Set();
    for (let f = 0; f < frames; f++) {
      update();
      seen.add([
        Math.round((boss.posePhase || 0) * 20),
        boss.mining ? 'M' : '', boss.strain ? 'S' : '',
        boss.conducting == null ? '' : Math.round(boss.conducting * 6),
        boss.weaponTimer > 0 ? 'W' : ''
      ].join('/'));
    }
    return seen;
  }

  function checkAnimated(boss, least = 3) {
    const seen = poseSamples(boss);
    check(seen.size >= least,
      `its kit moves through the fight (${seen.size} distinct poses, want ${least}+)`);
  }

  function findBoss() {
    return state.enemies.find(e => e.boss && e.mode === 'fight');
  }

  function runLevel(index, expect) {
    state.currentLevelIndex = index;
    switchTo('playing', { retry: true });
    const lv = getLevel();
    lv.cutscenes.length = 0;
    state.lives = 999;
    player.invincible = 99999;   // this probe is about the boss, not survival
    const boss = findBoss();
    out.push(`== level ${index} (${lv.name}): ${boss ? boss.bossKind : 'NO BOSS'} ==`);
    if (!boss) { check(false, 'has a fightable boss'); return; }
    // Stand in the arena. Bosses idle until the player is within
    // BOSS_ENGAGE_RANGE (entities/enemy.js) so they aren't running their
    // whole fight — announcing openings, digging pits — from across a level
    // the player hasn't reached yet. Testing one from the spawn point tests
    // a boss that is correctly doing nothing.
    player.x = boss.x - 200;
    player.y = boss.y;
    tick(2);
    check(!!player.weapon, `player arrives armed (${player.weapon})`);
    expect(boss, lv);
  }

  // Anything that throws in here otherwise leaves the page reading
  // "running…" forever, which says nothing about what went wrong.
  const report = () => {
    document.getElementById('out').textContent = out.join('\n');
  };
  setTimeout(() => {
   try {
    // --- level 2: The Excavator ---
    runLevel(1, (boss) => {
      boss.phase = 'advance'; boss.phaseTimer = 999;
      update();
      check(boss.invulnerable === true, 'closed while advancing');
      const noDamage = swingAt(boss, 2);
      check(noDamage === 0, `takes no damage while advancing (lost ${noDamage})`);

      boss.phase = 'jammed'; boss.phaseTimer = 999;
      update();
      check(boss.invulnerable === false, 'open once the drill jams');
      const hp0 = boss.hp;
      const dealt = swingAt(boss, 1);
      check(dealt === 1, `one pickaxe hit takes exactly 1 hp (took ${dealt}, hp ${hp0} -> ${boss.hp})`);

      // finish it off and check the drop
      boss.phase = 'jammed'; boss.phaseTimer = 999;
      swingAt(boss, 6);
      check(!boss.alive, `dies to sustained hits while jammed (hp ${boss.hp})`);
      for (let f = 0; f < 4; f++) update();
      const drop = state.weaponPickups.find(p => p.type === 'sledgehammer');
      check(!!drop, 'drops a sledgehammer');
      if (drop) {
        player.x = drop.x - 4; player.y = getLevel().groundY - player.height - 2;
        for (let f = 0; f < 6; f++) update();
        check(player.weapon === 'sledgehammer', `walking onto it arms the sledgehammer (weapon: ${player.weapon})`);
      }
      const blocking = state.enemies.some(e => e.boss && e.alive);
      check(!blocking, 'no boss left alive, so the way to the edge is open');
    });

    // --- the Excavator, played the way a kid would ---
    //
    // Reported from play: "you jump over the block and it proceeds to push
    // you over the edge; there is little time to engage, and the pit is
    // always in front of it, where you are standing." The pinned-phase
    // tests above can't see any of that. This plays the fight with the one
    // strategy the fight is supposed to teach — stay off the crack, run in
    // when it shouts, swing, back off — and requires it to win untouched.
    runLevel(1, (boss, lv) => {
      const left = boss.engageFromX;
      player.x = left + 10;                       // just over the block
      player.y = lv.groundY - player.height;
      player.invincible = 0;                      // a real hit counts
      const lives0 = state.lives;
      let swings = 0, frames = 0, hop = 0;
      const log = []; let livesSeen = state.lives;
      const key = (t, k) => document.dispatchEvent(new KeyboardEvent(t, { key: k }));
      for (; frames < 2400 && boss.alive; frames++) {
        const cracks = lv.pendingGaps || [];
        const pits = lv.platforms.filter(p => p.ground).map(p => p.x + p.width);
        if (boss.phase === 'jammed') {
          // go and hit it
          const target = boss.x - player.width - 4;
          if (player.x < target - 6) { key('keyup', 'ArrowLeft'); key('keydown', 'ArrowRight'); }
          else if (player.x > target + 6) { key('keyup', 'ArrowRight'); key('keydown', 'ArrowLeft'); }
          else {
            key('keyup', 'ArrowRight'); key('keyup', 'ArrowLeft');
            player.facing = 1;
            if (player.weaponCooldown <= 0) { startAttack(player); swings++; if (log.length < 8) log.push(`swing f${frames} px${Math.round(player.x)} bx${Math.round(boss.x)} inv${boss.invulnerable?1:0} hp${boss.hp}`); }
          }
          // a pit between here and there: hop it. Held for a few frames by
          // a counter — a setTimeout never fires inside this loop.
          if (player.isOnGround && hop <= 0 && player.x < target - 6 &&
              !hasFooting(player.x + player.width + 30, player.y + player.height)) {
            key('keydown', ' '); hop = 18;
          }
        } else {
          // stay off the crack and give it room
          const onCrack = cracks.some(c => player.x + player.width > c.x - 20 && player.x < c.x + c.width + 20);
          const tooClose = Math.abs((player.x + player.width / 2) - (boss.x + boss.w / 2)) < 90;
          if (onCrack || tooClose) { key('keyup', 'ArrowRight'); key('keydown', 'ArrowLeft'); }
          else { key('keyup', 'ArrowLeft'); key('keyup', 'ArrowRight'); }
          // but never back into the entry block: it's a wall
          if (player.x < left + 4) { key('keyup', 'ArrowLeft'); player.x = left + 4; }
        }
        if (hop > 0 && --hop === 0) key('keyup', ' ');
        update();
        if (state.lives < livesSeen) { livesSeen = state.lives; if (log.length < 8) log.push(`DIED f${frames} px${Math.round(player.x)} py${Math.round(player.y)} bx${Math.round(boss.x)} ${boss.phase} cracks${(lv.pendingGaps||[]).length}`); }
      }
      out.push('    ' + log.join(' | '));
      key('keyup', 'ArrowRight'); key('keyup', 'ArrowLeft'); key('keyup', ' ');
      check(!boss.alive, `a kid's strategy beats it (${swings} swings, ${frames} frames, hp ${boss.hp})`);
      check(state.lives === lives0, `without losing a life (lost ${lives0 - state.lives})`);
      check(boss.pits <= 2, `and the floor is still a floor (${boss.pits} pits)`);
    });

    // --- level 4: The Demolition Crew ---
    runLevel(3, () => {
      const crew = state.enemies.filter(e => e.crew === 'demo');
      check(crew.length === 3, `three of them (${crew.length})`);
      const shooter = crew.find(e => e.role === 'shooter');
      const bruiser = crew.find(e => e.role === 'bruiser');
      update();
      check(bruiser.invulnerable === true, 'a bruiser is shielded while the crew is linked');
      // The bruisers carry a pickaxe. For most of the game's life it was
      // decoration — `tool`, drawn and never used — so two thirds of this
      // fight was spheres walking into you.
      check(!!bruiser.weapon, `a bruiser is actually armed (${bruiser.weapon || 'nothing'})`);
      {
        player.x = bruiser.x - 30;
        player.y = bruiser.y;
        let swung = false;
        for (let f = 0; f < 200 && !swung; f++) { update(); if (bruiser.weaponTimer > 0) swung = true; }
        check(swung, 'and it swings when you are in front of it');
      }
      check(shooter.invulnerable === false, 'the shooter is the one you can reach');

      const noDamage = swingAt(bruiser, 2);
      check(noDamage === 0, `the bruiser takes nothing while linked (lost ${noDamage})`);

      // break the link
      swingAt(shooter, 4);
      check(!shooter.alive, `the shooter can be killed (hp ${shooter.hp})`);
      update();
      check(bruiser.invulnerable === false, 'killing the shooter drops the shield on the others');
      const nowDealt = swingAt(bruiser, 3);
      check(nowDealt > 0 || !bruiser.alive, 'and then they can be fought');

      state.enemies.filter(e => e.crew === 'demo').forEach(e => { e.alive = false; });
      update();
      check(!state.enemies.some(e => e.boss && e.alive && !e.restored), 'clearing the crew opens the way');
    });

    // --- level 5: The Terraformer ---
    runLevel(4, (boss, lv) => {
      const mover = lv.platforms.find(p => p.mover);
      check(!!mover, 'the arena has platforms it lifts');
      let sawOpen = false, sawClosed = false, minY = Infinity, maxY = -Infinity;
      for (let f = 0; f < 340; f++) {
        update();
        if (boss.invulnerable) sawClosed = true; else sawOpen = true;
        minY = Math.min(minY, mover.y);
        maxY = Math.max(maxY, mover.y);
      }
      check(sawClosed && sawOpen, `it closes and opens across its cycle (closed ${sawClosed}, open ${sawOpen})`);
      check(maxY - minY > 100, `the platforms really travel (${Math.round(maxY - minY)}px)`);

      // How LONG is the window, and how long is the platform down where it
      // can be boarded? Reported from play as "doesn't allow enough time to
      // get to him" — both numbers were near zero, because the lift was a
      // plain cosine and a cosine does not stop at either end.
      {
        // Up on the boss's own ledge for the measurement. The Terraformer
        // cracks the FLOOR under a player standing on it, so a player pinned
        // to the floor for 800 frames falls in, dies, and the respawn resets
        // the fight — which read as "the window never opens".
        player.x = boss.x - 60;
        player.y = boss.y;
        const mv = lv.platforms.find(p => p.mover);
        let open = 0, longestOpen = 0, low = 0, longestLow = 0;
        const bottom = mv.baseY == null ? mv.y : mv.baseY;
        for (let f = 0; f < 800; f++) {
          update();
          if (!boss.invulnerable) { open++; longestOpen = Math.max(longestOpen, open); } else open = 0;
          if (mv.y > bottom - 6) { low++; longestLow = Math.max(longestLow, low); } else low = 0;
        }
        // A second of each. Enough to step on, and enough to cross and
        // land a couple of hits after crossing.
        check(longestOpen >= 60, `the window stays open for ${longestOpen} frames at a stretch`);
        check(longestLow >= 40, `and the platform waits ${longestLow} frames at the bottom to be boarded`);
      }
      // Its arms are the tell for the window: up while it's holding the
      // room, dropped the moment it opens. If those two ever stop being the
      // same event the boss stops being readable.
      {
        let upWhileClosed = false, downWhenOpen = true;
        for (let f = 0; f < 400; f++) {
          update();
          if (boss.invulnerable && boss.conducting > 0.5) upWhileClosed = true;
          if (!boss.invulnerable && boss.conducting > 0.05) downWhenOpen = false;
        }
        check(upWhileClosed, 'its arms go up while it is holding the room shut');
        check(downWhenOpen, 'and drop the moment it opens');
      }
      // The ledge is only reachable from a raised mover — that IS the fight.
      check(minY < lv.platforms.find(p => p.y === 150 || p.baseY === 150).y + 60,
        'the lifted platform rises to near the boss ledge');

      // And it can be finished once you're up there. Modelled the way a
      // player actually fights it — stand level with it on the ledge and
      // shoot whenever it opens — rather than by forcing the flag, which
      // the boss's own cycle overwrites on the very next tick. That was
      // this probe's first version, and it reported the Terraformer as
      // unkillable when the real problem was the test.
      const hp0 = boss.hp;
      for (let f = 0; f < 1400 && boss.alive; f++) {
        update();
        if (!boss.invulnerable && player.weaponCooldown === 0) {
          player.x = boss.x - 80;
          player.y = boss.y;
          player.facing = 1;
          player.ammo = 99;
          startAttack(player);
        }
      }
      check(!boss.alive, `it can be beaten from the raised platform (hp ${hp0} -> ${boss.hp})`);
    });

    // --- level 6: The General ---
    runLevel(5, (boss) => {
      update();
      check(boss.invulnerable === false, 'open the whole time — no gimmick');
      const phases = new Set();
      for (let f = 0; f < 400; f++) { update(); phases.add(boss.phase); }
      check(phases.has('charge') && phases.has('recover'),
        `it charges and then has to recover (saw: ${[...phases].join(', ')})`);
      check(!!boss.weapon, `it is actually holding the sledgehammer (${boss.weapon || 'nothing'})`);
      // ...and it swings it. "Pure combat, no gimmick" was being fought by
      // walking into people.
      {
        let swung = false;
        for (let f = 0; f < 400 && !swung; f++) {
          player.x = boss.x - 34;
          player.y = boss.y;
          update();
          if (boss.weaponTimer > 0) swung = true;
        }
        check(swung, 'and swings it at you in close');
      }
      const hp0 = boss.hp;
      swingAt(boss, 8);
      check(!boss.alive, `it can be beaten by out-playing it (hp ${hp0} -> ${boss.hp})`);
    });

    // --- and every one of them is ANIMATED ---
    //
    // Its own pass, deliberately, because the fight tests above pin phases
    // and timers to reach specific moments — which is exactly the wrong
    // conditions for asking "does this thing move on its own". Here nothing
    // is pinned: the boss is left alone with its phase machine for four
    // hundred frames and the visual state it owns is sampled.
    out.push('== every boss animates itself ==');
    for (const [index, name, least] of [[1, 'excavator', 3], [3, 'crew', 2],
                                        [4, 'terraformer', 4], [5, 'general', 4]]) {
      state.currentLevelIndex = index;
      switchTo('playing', { retry: true });
      getLevel().cutscenes.length = 0;
      state.lives = 999;
      player.invincible = 99999;
      const boss = findBoss();
      if (!boss) { check(false, `${name}: present`); continue; }
      // Inside BOSS_ENGAGE_RANGE, and inside the boss's own patrol — a
      // boss is leashed to minX/maxX like anything else, so standing just
      // OUTSIDE the arena means it walks to the fence and stops there,
      // which for the crew meant it never got close enough to swing and
      // read as "it doesn't animate".
      player.x = Math.max(boss.minX + 30, boss.x - 240);
      player.y = boss.y;
      const seen = poseSamples(boss);
      check(seen.size >= least,
        `${name}: its kit moves through the fight (${seen.size} distinct poses, want ${least}+)`);
    }

    out.push(fails ? `*** ${fails} FAILURE(S)` : 'PASS every boss opens, closes, animates and pays out');
   } catch (err) {
    out.push('*** THREW: ' + (err && err.stack ? err.stack.split('\n').slice(0, 3).join(' | ') : err));
   }
    out.push('errors: ' + (window.__errs.length ? window.__errs.join(' | ') : 'none'));
    report();
  }, 250);
</script></body></html>
