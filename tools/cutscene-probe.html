<!DOCTYPE html>
<html><body style="margin:0;background:#000;"><canvas id="game" width="800" height="450"></canvas><pre id="out"></pre>
<script>localStorage.setItem('blockbash-save', JSON.stringify({ saveVersion: 1, furthestLevelIndex: 0, bestScore: 0, hasSeenIntro: true })); window.__errs=[];window.addEventListener('error',e=>window.__errs.push('ERR: '+(e.message||e.error)));</script>
<script type="module" src="../src/main.js"></script>
<script type="module">
  import { player } from '../src/entities/player.js';
  import { state } from '../src/state.js';
  import { update } from '../src/scenes/sceneManager.js';
  import { getLevel } from '../src/levels/levelLoader.js';
  import { particles } from '../src/entities/particles.js';
  import { camera } from '../src/engine/camera.js';
  import { switchTo } from '../src/scenes/sceneManager.js';
  import { isCutsceneActive, hasCompleted } from '../src/cutscenes/runner.js';
  const key=(t,k)=>document.dispatchEvent(new KeyboardEvent(t,{key:k}));
  const out=[];
  setTimeout(() => {
    key('keydown',' '); key('keyup',' ');
    const lv = getLevel();
    const boss = state.enemies.find(e => e.boss);
    out.push(`wakeX=${lv.boss.wakeX}  boss starts at ${Math.round(boss.x)}  gap=${Math.round(boss.x - lv.boss.wakeX)}px`);

    player.x = lv.boss.wakeX - 40; player.y = lv.groundY - player.height;
    player.velocityX = 0; player.velocityY = 0; player.invincible = 99999;
    state.score = 0;
    // Seed the camera close to where it'd actually be by the time a real
    // player reaches this spot (it's been following them the whole level),
    // rather than the 0 it starts at when this probe jumps straight here —
    // the cutscene now also requires the boss to be fully on-screen (not
    // just wakeX crossed), and camera eases toward its target rather than
    // snapping, so an unseeded camera would never catch up in time.
    camera.x = Math.min(player.x - 800 / 2.6, lv.worldWidth - 800);
    key('keydown','ArrowRight');
    for (let i = 0; i < 80 && !boss.awake; i++) update();
    key('keyup','ArrowRight');

    const clampX = () => player.x + player.width + 40;
    let clampedAt = null, diedAt = null, particlesOnDeath = 0, bossXAtDeath = null;
    for (let i = 0; i < 600; i++) {
      const before = particles.length;
      const aliveBefore = boss.alive;
      update();
      if (boss.alive && clampedAt === null && Math.abs(boss.x - clampX()) < 1.5) clampedAt = i;
      if (aliveBefore && !boss.alive) {
        diedAt = i; particlesOnDeath = particles.length - before; bossXAtDeath = Math.round(boss.x);
        break;
      }
    }
    out.push(`boss clamped against player at frame: ${clampedAt === null ? 'never (good - it was still charging)' : clampedAt}`);
    out.push(`boss died at frame ${diedAt}, at x=${bossXAtDeath} (player at ${Math.round(player.x)})`);
    out.push(`particles spawned on death frame: ${particlesOnDeath}`);
    out.push(particlesOnDeath >= 20
      ? '  -> 22 = explosion + landing dust = REAL STOMP, the NPC came down on it'
      : '  -> 10 = explosion only = FALLBACK, the NPC landed on the ground and the boss just popped');
    // === skipping the fight still leaves it won (2026-09-21) ===
    // The kill and the pickaxe drop moved into the cutscene's onComplete
    // when it was ported to the runner, precisely so that Escape (and the
    // Shift+K parent unlock) can't strand the player next to a live boss
    // with no weapon and no way past. Asserted rather than assumed,
    // because the failure is unreachable in normal play and would only
    // ever be found by whoever pressed Escape at the wrong moment.
    out.push('=== skipping the showdown still resolves it ===');
    switchTo('playing');                        // re-enter = a fresh run
    const lv2 = getLevel();
    const boss2 = state.enemies.find(e => e.boss);
    player.x = lv2.boss.wakeX - 40; player.y = lv2.groundY - player.height;
    player.velocityX = 0; player.velocityY = 0; player.invincible = 99999;
    camera.x = Math.min(player.x - 800 / 2.6, lv2.worldWidth - 800);
    key('keydown','ArrowRight');
    for (let i = 0; i < 80 && !boss2.awake; i++) update();
    key('keyup','ArrowRight');
    for (let i = 0; i < 30; i++) update();      // a little way into the scene
    out.push(`cutscene running before the skip: ${isCutsceneActive()}  (must be true)`);
    key('keydown','Escape'); key('keyup','Escape');
    out.push(`boss alive after skipping: ${boss2.alive}  (must be false)`);
    out.push(`pickaxe left on the ground: ${state.weaponPickups.length > 0}  (must be true)`);
    out.push(`way to the edge is clear: ${hasCompleted('boss-showdown')}  (must be true)`);

    out.push('errors: ' + (window.__errs.length ? window.__errs.join(' | ') : 'none'));
    document.getElementById('out').textContent = out.join('\n');
  }, 200);
</script></body></html>
