<!DOCTYPE html>
<html><body style="margin:0;background:#000;">
<script>localStorage.setItem('blockbash-save', JSON.stringify({ saveVersion: 1, furthestLevelIndex: 0, bestScore: 0, hasSeenIntro: true }));</script>
<canvas id="game" width="800" height="450"></canvas><pre id="out"></pre>
<script>window.__errs=[];window.addEventListener('error',e=>window.__errs.push('ERR: '+(e.message||e.error)));</script>
<script type="module" src="../src/main.js"></script>
<script type="module">
  import { player } from '../src/entities/player.js';
  import { state } from '../src/state.js';
  import { update } from '../src/scenes/sceneManager.js';
  import { keys } from '../src/engine/input.js';
  import { pollGamepad } from '../src/engine/gamepad.js';
  const key = (t, k) => document.dispatchEvent(new KeyboardEvent(t, { key: k }));
  const out = [];

  // A fake gamepad the poll loop reads via navigator.getGamepads() — no
  // real hardware is available in headless testing, so this exercises the
  // polling/edge-detection/synthetic-dispatch logic directly. It does NOT
  // prove real Xbox hardware behaves identically; that only Mike can check.
  const fakePad = {
    connected: true,
    buttons: Array.from({ length: 16 }, () => ({ pressed: false })),
    axes: [0, 0]
  };
  navigator.getGamepads = () => [fakePad];
  const tick = () => { pollGamepad(); update(); };

  setTimeout(() => {
    key('keydown', ' '); key('keyup', ' '); // title -> playing
    state.enemies.forEach(e => e.alive = false);
    player.x = 1000; player.y = 380; player.velocityX = 0; player.velocityY = 0; player.invincible = 9999;
    tick();

    // --- B (index 1, right button = jump) press should register as keys[' '] ---
    fakePad.buttons[1].pressed = true;
    tick();
    out.push('1. B pressed: keys[" "]=' + !!keys[' '] + '  (must be true)');
    fakePad.buttons[1].pressed = false;
    tick();
    out.push('2. B released: keys[" "]=' + !!keys[' '] + '  (must be false)');

    // --- left stick should drive movement ---
    // respawnFreeze is reset to 0 before each timed run — otherwise the
    // ~0.5s post-spawn freeze (set by resetPlayer() when title->playing
    // fired above) silently eats into the tick budget below. That went
    // unnoticed under the old, much larger ACCEL (saturated to cap in ~4-5
    // frames regardless); the real SMB3-accurate accel (physics-lab,
    // 2026-09-20) ramps up over dozens of frames, so a shortened window
    // shows up as a real shortfall instead of a rounding error. Tick counts
    // below are sized to comfortably clear each cap from a standing start
    // (walkMax needs ~28 frames, runMax ~46 — see physics.js's accel).
    player.x = 1000; player.velocityX = 0; player.respawnFreeze = 0;
    fakePad.axes[0] = -1; // full left
    for (let i = 0; i < 60; i++) tick();
    out.push('3. stick full left for 60 ticks: velocityX=' + player.velocityX.toFixed(2) + '  (must be negative, walk-capped near -2.06)');
    fakePad.axes[0] = 0;

    // --- A (index 0, bottom button = run) should raise the speed cap ---
    player.x = 1000; player.velocityX = 0; player.respawnFreeze = 0;
    player.pMeter = 0; player.pMeterTimer = 0; // fresh P-meter — this checks the runMax cap, not pSpeedMax
    fakePad.axes[0] = -1;
    fakePad.buttons[0].pressed = true; // A = run
    for (let i = 0; i < 60; i++) tick();
    out.push('4. stick left + A held for 60 ticks: velocityX=' + player.velocityX.toFixed(2) + '  (must be more negative than step 3 — run-capped near -3.44)');
    fakePad.axes[0] = 0; fakePad.buttons[0].pressed = false;

    // --- Y (action) should do nothing until the weapon is earned, then
    // trigger a swing (weaponCooldown kicks in) once it is ---
    import('../src/state.js').then(({ state }) => {
      player.hasWeapon = false;
      player.weaponCooldown = 0;
      fakePad.buttons[3].pressed = true; // Y
      tick();
      out.push('5. Y pressed unarmed: weaponCooldown=' + player.weaponCooldown + '  (must be 0 — gated until earned)');
      fakePad.buttons[3].pressed = false;
      tick();

      player.hasWeapon = true;
      fakePad.buttons[3].pressed = true; // Y
      tick();
      out.push('5b. Y pressed armed: weaponCooldown=' + player.weaponCooldown + '  (must be > 0 — swing attempted)');
      fakePad.buttons[3].pressed = false;
      tick();

      // --- Start (menu) should pause ---
      const frameBefore = state.frameCount;
      fakePad.buttons[9].pressed = true; // Start
      tick();
      fakePad.buttons[9].pressed = false;
      tick();
      const frameAfterToggle = state.frameCount;
      for (let i = 0; i < 20; i++) tick();
      out.push('6. after Start toggled pause: frameCount stayed at ' + frameAfterToggle + ' -> ' + state.frameCount + '  (must NOT advance while paused)');

      // unpause
      fakePad.buttons[9].pressed = true;
      tick();
      fakePad.buttons[9].pressed = false;
      tick();
      const frameResumed1 = state.frameCount;
      for (let i = 0; i < 10; i++) tick();
      out.push('7. after Start toggled again (unpause): frameCount ' + frameResumed1 + ' -> ' + state.frameCount + '  (must advance again)');

      out.push('errors: ' + (window.__errs.length ? window.__errs.join(' | ') : 'none'));
      document.getElementById('out').textContent = out.join('\n');
    });
  }, 200);
</script></body></html>
