<!DOCTYPE html>
<html><body style="margin:0;background:#000;">
<canvas id="game" width="800" height="450"></canvas><pre id="out">running…</pre>
<script>localStorage.setItem('blockbash-save', JSON.stringify({ saveVersion: 1, furthestLevelIndex: 0, bestScore: 0, hasSeenIntro: true, narrative: { seenCutscenes: {}, npcStage: 0, flags: {} } })); window.__errs=[];window.addEventListener('error',e=>window.__errs.push('ERROR: '+(e.message||e.error)));</script>
<script type="module" src="../src/main.js"></script>
<script type="module">
  // Can you stay on a moving platform?
  //
  // Reported from play, twice: "you just get kicked off of them, and it isn't
  // possible to get the coins or triangles", first about the Terraformer's
  // lifts and then about "a couple of the vertical moving platforms."
  //
  // The cause is in the ORDER of a frame. A platform moves, and then the
  // player's horizontal collision resolves. If a lift has risen even 2px into
  // a walking player's feet, that reads as a side hit and the player is
  // shoved clean off the platform's edge. Standing perfectly still happened
  // to work, which is why nothing ever noticed: the first thing anyone does on
  // a lift is take a step.
  //
  // So: stand on every moving platform in the game, at every phase, shuffle
  // about on it like a person does, and require that you are still on it.
  import { player } from '../src/entities/player.js';
  import { state } from '../src/state.js';
  import { update, switchTo } from '../src/scenes/sceneManager.js';
  import { getLevel } from '../src/levels/levelLoader.js';
  import { levels } from '../src/levels/registry.js';
  import { coins } from '../src/entities/coins.js';

  const key = (t, k) => document.dispatchEvent(new KeyboardEvent(t, { key: k }));
  const out = [];
  let fails = 0;
  const check = (ok, label) => { if (!ok) fails++; out.push(`  ${ok ? 'ok  ' : 'FAIL'} ${label}`); };

  const onIt = (p) => {
    const feet = player.y + player.height;
    return player.x + player.width > p.x && player.x < p.x + p.width &&
           Math.abs(feet - p.y) <= 5 && player.isOnGround;
  };

  // Shuffle: short steps left and right, never walking off the ends.
  function shuffleOn(p, frames) {
    let off = 0, worst = 0, dir = 1, steps = 0, jump = 0, lastX = player.x;
    for (let f = 0; f < frames; f++) {
      const mid = p.x + p.width / 2;
      const px = player.x + player.width / 2;
      if (px > mid + p.width * 0.28) dir = -1;
      else if (px < mid - p.width * 0.28) dir = 1;
      key(dir > 0 ? 'keyup' : 'keydown', 'ArrowLeft');
      key(dir > 0 ? 'keydown' : 'keyup', 'ArrowRight');
      update();
      // A person walks ~3px a frame and a platform carries them ~1 more. Ten
      // is a teleport — the actual symptom: 74px in one frame, across the
      // platform to its far side.
      jump = Math.max(jump, Math.abs(player.x - lastX)); lastX = player.x;
      if (!onIt(p)) { off++; worst = Math.max(worst, Math.abs(player.y + player.height - p.y)); }
      else steps++;
    }
    key('keyup', 'ArrowLeft'); key('keyup', 'ArrowRight');
    return { off, worst, steps, jump };
  }

  setTimeout(() => {
    // CONTROL: the same shuffle on a platform that does not move. If this
    // fails the probe is measuring itself.
    {
      state.currentLevelIndex = 0;
      switchTo('playing', { retry: true });
      const lv0 = getLevel();
      lv0.cutscenes.length = 0; state.lives = 999;
      state.enemies.forEach(e => { e.alive = false; });
      const p0 = lv0.platforms.find(p => !p.ground && p.width >= 100 && p.height <= 20);
      player.invincible = 999999;
      player.x = p0.x + p0.width / 2 - player.width / 2; player.y = p0.y - player.height;
      player.velocityX = 0; player.velocityY = 0; player.isOnGround = true;
      for (let f = 0; f < 4; f++) update();
      const r = shuffleOn(p0, 260);
      check(r.off <= 2, `control — a platform that stands still: ${r.off} frames off it`);
    }
    for (let i = 0; i < levels.length; i++) {
      state.currentLevelIndex = i;
      switchTo('playing', { retry: true });
      const lv = getLevel();
      lv.cutscenes.length = 0;
      state.lives = 999;
      // Nothing in the way, and nothing that can hurt.
      state.enemies.forEach(e => { if (!e.boss) e.alive = false; });
      const movers = lv.platforms.filter(p => p.move || p.mover);
      if (!movers.length) continue;
      out.push(`== level ${i + 1}: ${lv.name} (${movers.length} moving platforms) ==`);

      for (const p of movers) {
        let worstOff = 0, worstGap = 0, lost = 0;
        // Several phases of the cycle, because the platform is somewhere
        // different every time a player happens to step on it.
        let worstJump = 0;
        for (let trial = 0; trial < 6; trial++) {
          // Let the platform get to a new place with nobody on it. Changing
          // the frame clock under a rider teleports the PLATFORM, which is a
          // harness artifact and not the thing being tested.
          state.frameCount += 41;
          player.invincible = 999999;
          const floorY = lv.groundY;
          player.x = p.x + p.width / 2 - player.width / 2;
          player.y = floorY - player.height;
          player.velocityX = 0; player.velocityY = 0;
          for (let f = 0; f < 37; f++) update();
          // Now step on at wherever it is.
          player.x = p.x + p.width / 2 - player.width / 2;
          player.y = p.y - player.height;
          player.velocityX = 0; player.velocityY = 0; player.isOnGround = true;
          const r = shuffleOn(p, 260);
          worstOff = Math.max(worstOff, r.off);
          worstGap = Math.max(worstGap, r.worst);
          worstJump = Math.max(worstJump, r.jump);
          if (!onIt(p) && (player.x + player.width < p.x || player.x > p.x + p.width)) lost++;
        }
        const label = `${p.move ? (p.move.y ? 'lift' : 'slider') : 'boss-driven lift'} at x${p.baseX == null ? p.x : p.baseX}: ` +
          `${worstOff} frames off it at worst (${Math.round(worstGap)}px away), shoved clean off ${lost}/6, biggest jump ${Math.round(worstJump)}px in a frame`;
        // A player is allowed a frame or two airborne (a platform moving down
        // faster than gravity), never more, and never put off the edge.
        check(lost === 0 && worstOff <= 6 && worstJump < 12, label);
      }
    }
    // --- and the things placed ABOVE them can actually be picked up ---
    //
    // "...and it isn't possible to get the coins or triangles." The coins and
    // ammo over a lift are placed on the assumption you can ride it up to
    // them. Ride each one the way a person would: line up under the pickup,
    // jump when it is within reach, and require that it is collected.
    out.push('== pickups over moving platforms ==');
    for (let i = 0; i < levels.length; i++) {
      state.currentLevelIndex = i;
      switchTo('playing', { retry: true });
      const lv = getLevel();
      lv.cutscenes.length = 0;
      state.lives = 999;
      state.enemies.forEach(e => { if (!e.boss) e.alive = false; });
      const movers = lv.platforms.filter(p => p.move || p.mover);
      if (!movers.length) continue;
      const items = [
        ...coins.map(c => ({ kind: 'coin', x: c.x, y: c.y, ref: c })),
        ...state.weaponPickups.filter(w => !w.fromBoss).map(w => ({ kind: 'triangles', x: w.x, y: w.y - w.size / 2, ref: w }))
      ];
      let tried = 0, got = 0;
      for (const p of movers) {
        const travel = (p.move && p.move.y) || p.mover || 0;
        const span = (p.move && p.move.x) || 0;
        const bx = p.baseX == null ? p.x : p.baseX, by = p.baseY == null ? p.y : p.baseY;
        const mine = items.filter(it =>
          it.x >= bx - 10 && it.x <= bx + span + p.width + 10 &&
          it.y >= by - travel - 70 && it.y <= by + 10);
        for (const it of mine) {
          tried++;
          let ok = false;
          for (let trial = 0; trial < 3 && !ok; trial++) {
            state.frameCount += 53;
            player.invincible = 999999;
            const floorY = lv.groundY;
            player.x = p.x + p.width / 2 - player.width / 2; player.y = floorY - player.height;
            player.velocityX = 0; player.velocityY = 0;
            for (let f = 0; f < 29; f++) update();
            player.x = p.x + p.width / 2 - player.width / 2; player.y = p.y - player.height;
            player.velocityX = 0; player.velocityY = 0; player.isOnGround = true;
            let hop = 0;
            for (let f = 0; f < 900 && !ok; f++) {
              const pcx = player.x + player.width / 2;
              const feet = player.y + player.height;
              const dx = it.x - pcx;
              // keep to the platform; head for the pickup
              const wantRight = dx > 5 && pcx < p.x + p.width - 8;
              const wantLeft = dx < -5 && pcx > p.x + 8;
              key(wantRight ? 'keydown' : 'keyup', 'ArrowRight'); key(wantLeft ? 'keydown' : 'keyup', 'ArrowLeft');
              const above = feet - it.y;       // how far over the feet the pickup is
              if (hop <= 0 && player.isOnGround && Math.abs(dx) < 14 && above > 4 && above < 95) { key('keydown', ' '); hop = 18; }
              if (hop > 0 && --hop === 0) key('keyup', ' ');
              update();
              if (it.ref.collected) ok = true;
            }
            key('keyup', 'ArrowRight'); key('keyup', 'ArrowLeft'); key('keyup', ' ');
          }
          if (ok) got++;
          else check(false, `level ${i + 1}: the ${it.kind} at [${Math.round(it.x)}, ${Math.round(it.y)}] over the platform at x${bx} could not be picked up by riding it`);
        }
      }
      if (tried) check(got === tried, `level ${i + 1}: ${got}/${tried} pickups over moving platforms collected by riding them`);
    }

    out.push(fails ? `*** ${fails} FAILURE(S)` : 'PASS you can stand, walk and stay on every moving platform in the game, and reach what is over them');
    out.push('errors: ' + (window.__errs.length ? window.__errs.join(' | ') : 'none'));
    document.getElementById('out').textContent = out.join('\n');
  }, 250);
</script></body></html>
