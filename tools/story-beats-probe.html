<!DOCTYPE html>
<html><body style="margin:0;background:#000;">
<canvas id="game" width="800" height="450"></canvas><pre id="out">running…</pre>
<script>localStorage.setItem('blockbash-save', JSON.stringify({ saveVersion: 1, furthestLevelIndex: 0, bestScore: 0, hasSeenIntro: true, narrative: { seenCutscenes: {}, npcStage: 0, flags: {} } })); window.__errs=[];window.addEventListener('error',e=>window.__errs.push('ERROR: '+(e.message||e.error)));</script>
<script type="module" src="../src/main.js"></script>
<script type="module">
  // The story beats that a player can be BLOCKED by, driven end to end.
  //
  // Geometry has its own gate (level-audit-probe). This is the other way a
  // level becomes unfinishable: a scene that doesn't fire, a weapon that
  // isn't actually handed over, or a boss that can't be beaten by the verb
  // it's supposed to be beaten by. Level 3 is the one that matters most —
  // the Cornerstone arrives there, and the Sculptor at the end of it cannot
  // be hurt by anything else.
  import { player } from '../src/entities/player.js';
  import { state } from '../src/state.js';
  import { update, switchTo, getCurrentName , handleKeyDown } from '../src/scenes/sceneManager.js';
  import { getLevel, surfaceYAt } from '../src/levels/levelLoader.js';
  import { getWeapon } from '../src/weapons/registry.js';
  import { startAttack } from '../src/weapons/combat.js';
  import { levels } from '../src/levels/registry.js';
  import { markCutsceneSeen, hasSeenCutscene, resetNarrative } from '../src/narrative.js';
  import { isCutsceneActive, activeCutsceneId, skipCutscene } from '../src/cutscenes/runner.js';

  const out = [];
  let fails = 0;
  const check = (ok, label) => { if (!ok) fails++; out.push(`  ${ok ? 'ok  ' : 'FAIL'} ${label}`); };

  const tick = n => { for (let i = 0; i < n; i++) update(); };

  // Stand next to the target and fire, however many times it takes.
  function fireAt(target, shots) {
    for (let n = 0; n < shots; n++) {
      player.x = target.x - 90;
      player.y = target.y;
      player.facing = 1;
      player.weaponCooldown = 0;
      startAttack(player);
      tick(30);
    }
  }

  function swingAt(target, times) {
    for (let n = 0; n < times; n++) {
      player.x = target.x - player.width - 6;
      player.y = target.y;
      player.facing = 1;
      player.weaponCooldown = 0;
      startAttack(player);
      tick(26);
    }
  }

  setTimeout(() => {
    state.currentLevelIndex = 2;
    switchTo('playing', { retry: true });
    const lv = getLevel();
    state.lives = 999;
    player.invincible = 999999;   // this probe is about the story, not survival
    out.push(`== level 3 (${lv.name}) ==`);
    check(player.weapon === 'drill', `arrives with the drill (${player.weapon})`);

    // 1. a corrupted square cannot be beaten, only restored
    const octagon = state.enemies.find(e => e.kind === 'octagon' && !e.boss);
    check(!!octagon, 'the level has a corrupted square before the handoff');
    if (octagon) {
      const hp0 = octagon.hp;
      swingAt(octagon, 3);
      check(octagon.alive && octagon.hp === hp0,
        `the drill does nothing to it (alive ${octagon.alive}, hp ${octagon.hp})`);
    }

    // 2. walking past the clearing starts the handoff
    player.x = 3102;
    player.y = lv.groundY - player.height;
    tick(2);
    check(isCutsceneActive() && activeCutsceneId() === 'l3-handoff',
      `the handoff fires at 3100 (active: ${activeCutsceneId()})`);

    // 3. and skipping it still leaves the player armed
    skipCutscene();
    tick(2);
    check(player.weapon === 'cornerstone', `skipping still hands over the Cornerstone (${player.weapon})`);
    check(getWeapon(player.weapon)?.ammo == null, 'arrives with unlimited triangles');

    // 4. he is TAKEN here, not restored here.
    //
    // The arc used to open and close inside this one scene. It now runs to
    // the fifth face, so the thing to assert about level 3 is the opposite
    // of what it used to be: that he is gone, that no version of him is left
    // standing in the level, and that the player nonetheless has something
    // to use the new tool on within a few seconds.
    check(!state.enemies.some(e => e.quarrick), 'he is not left behind as a target here');
    check(state.rescueNPC == null, 'and he is not left standing in the level either');
    const afterHandoff = state.enemies.filter(e => e.kind === 'octagon' && !e.boss && e.x > 3100);
    check(afterHandoff.length > 0,
      `there is a corrupted square past the clearing to learn the verb on (${afterHandoff.length})`);
    if (afterHandoff.length) {
      const target = afterHandoff.sort((a, b) => a.x - b.x)[0];
      check(target.x - 3100 < 700,
        `and it is within a few seconds' walk of the handoff (${Math.round(target.x - 3100)}px)`);
      player.ammo = 20;
      fireAt(target, target.restoreHits);
      check(target.restored, 'and the Cornerstone works on it');
    }

    // 4b. dying afterwards must not replay the handoff
    //
    // Reported from play. A mid-level death resets the player's POSITION,
    // not what they're carrying — but it also calls resetCutscenes(), which
    // wipes the runtime "already played" set. So walking back past the
    // trigger re-ran the entire handoff-and-corruption scene for someone
    // already holding the Cornerstone.
    {
      const lives0 = state.lives;
      player.invincible = 0;
      for (let i = 0; i < 200 && state.lives === lives0; i++) {
        player.y = 5000; player.velocityY = 40; update();
      }
      tick(4);
      player.invincible = 999999;
      check(state.lives < lives0, 'the player can die after the handoff');
      check(player.weapon === 'cornerstone', `and still has the Cornerstone (${player.weapon})`);

      // walk back past the handoff trigger
      player.x = 3110;
      player.y = getLevel().groundY - player.height;
      tick(6);
      check(activeCutsceneId() !== 'l3-handoff',
        `the handoff does not replay (active: ${activeCutsceneId() || 'nothing'})`);
      if (isCutsceneActive()) skipCutscene();
    }

    // 5. the Sculptor: immune to the weapon, beaten by the verb
    const sculptor = state.enemies.find(e => e.boss);
    check(!!sculptor, 'the Sculptor is present');
    if (sculptor) {
      const wasCornerstone = player.weapon;
      player.weapon = 'drill';
      swingAt(sculptor, 3);
      check(sculptor.alive && !sculptor.restored, 'the drill does nothing to the Sculptor');
      player.weapon = wasCornerstone;
      // Putting the hammer in the player's hands for three swings made
      // `lacksWeapon: 'cornerstone'` true, which re-armed level 3's handoff
      // — its other condition, reachX 3250, stays satisfied for the rest of
      // the level. That cutscene freezes physics, so the next six triangles
      // fired and then hung in the air, and the Sculptor read as immune.
      //
      // Worth knowing beyond this probe: the handoff WILL re-run for anyone
      // who loses the Cornerstone later in level 3. Nothing there can take
      // it away today, and on a game-over retry re-running it is exactly
      // right — but a future edit that adds a weapon pickup to that level
      // would need to think about this.
      check(activeCutsceneId() !== 'l3-handoff' || true,
        `(weapon swap re-armed the handoff: ${activeCutsceneId() || 'no'})`);
      if (isCutsceneActive()) { skipCutscene(); tick(2); }
      player.weapon = wasCornerstone;
      player.ammo = 20;
      fireAt(sculptor, 6);
      check(sculptor.restored, `six triangles restore it (hits left ${sculptor.restoreHits})`);
      tick(2);
      const blocking = state.enemies.some(e => e.boss && e.alive && !e.restored);
      check(!blocking, 'restoring it opens the way to the edge');
    }

    // --- level 5: the reunion ---
    //
    // The payoff the handoff sets up and deliberately doesn't pay. Two ways
    // this can silently break and strand the story: the corrupted Quarrick
    // not actually being in the level data, and the restoration not firing
    // the scene that turns him back into a character. Both are the kind of
    // thing that only shows up two levels later, as an absence.
    state.currentLevelIndex = 4;
    switchTo('playing', { retry: true });
    const lv5 = getLevel();
    state.lives = 999;
    player.invincible = 999999;
    out.push(`== level 5 (${lv5.name}) ==`);
    // The arrival scene is running from frame one (levelStart) and it locks
    // physics, so anything fired before it ends hangs in the air. Get it out
    // of the way first — the level 3 block above happens to reach its
    // trigger after its own opening has finished, which is why this wasn't
    // needed there.
    tick(2);
    if (isCutsceneActive()) { skipCutscene(); tick(3); }
    check(player.weapon === 'cornerstone', `arrives with the Cornerstone (${player.weapon})`);

    const lost = state.enemies.find(e => e.quarrick);
    check(!!lost, 'the corrupted Quarrick is on this face');
    if (lost) {
      check(lost.kind === 'octagon', `and he is one of them (${lost.kind})`);
      // Affordable. The whole point of moving the rescue this late is that
      // it costs something real — but a player who has spent normally must
      // still be able to pay, or the story has a paywall in it.
      check(getWeapon(player.weapon)?.ammo == null,
        'restoration cannot run out of triangles');

      // the scene that names him fires before he can be shot
      player.x = 4302;
      player.y = lv5.groundY - player.height;
      tick(2);
      check(isCutsceneActive() && activeCutsceneId() === 'l5-found',
        `finding him fires its own scene (active: ${activeCutsceneId()})`);
      skipCutscene();
      tick(2);

      const cost = lost.restoreHits;
      fireAt(lost, cost);
      check(lost.restored, `${cost} triangles put him back (hits left ${lost.restoreHits})`);
      tick(3);
      check(isCutsceneActive() && activeCutsceneId() === 'l5-restored',
        `and that fires the reunion (active: ${activeCutsceneId()})`);
      skipCutscene();
      tick(3);

      // and dying afterwards doesn't replay it on top of a restored Quarrick
      const lives0 = state.lives;
      player.invincible = 0;
      for (let i = 0; i < 200 && state.lives === lives0; i++) {
        player.y = 5000; player.velocityY = 40; update();
      }
      tick(4);
      player.invincible = 999999;
      player.x = 4310;
      player.y = getLevel().groundY - player.height;
      tick(6);
      check(activeCutsceneId() !== 'l5-restored',
        `the reunion does not replay (active: ${activeCutsceneId() || 'nothing'})`);
      if (isCutsceneActive()) skipCutscene();
    }

    // --- level 6: no trade, and the General's own weapon ---
    // There used to be a sledgehammer on a shelf here, and a probe for the
    // trade. The hammer left the player's roster (it was a slower pickaxe);
    // what this face asks is only that the Cornerstone arrives loaded, and
    // that the General carries the thing its troops do.
    state.currentLevelIndex = 5;
    switchTo('playing', { retry: true });
    const lv6 = getLevel();
    lv6.cutscenes.length = 0;
    state.lives = 999;
    player.invincible = 999999;
    out.push(`== level 6 (${lv6.name}) ==`);
    check(player.weapon === 'cornerstone' && getWeapon(player.weapon).ammo == null,
      `arrives with the Cornerstone loaded (${player.weapon}, ${player.ammo})`);
    // Ammo caches are weaponPickups too; they top up, they don't trade.
    const WEAPONS = ['pickaxe', 'drill', 'sledgehammer', 'chainsaw', 'cornerstone'];
    check(!state.weaponPickups.some(w => !w.collected && WEAPONS.includes(w.type)), 'nothing is lying around to trade it for');
    const general = state.enemies.find(e => e.bossKind === 'general');
    check(general && general.weapon === 'chainsaw', `the General carries a chainsaw (${general && general.weapon})`);

    // --- level 7: the core, and the end of the game ---
    state.currentLevelIndex = 6;
    switchTo('playing', { retry: true });
    const lv7 = getLevel();
    lv7.cutscenes.length = 0;   // put back below, one at a time
    state.lives = 999;
    player.invincible = 999999;
    out.push(`== level 7 (${lv7.name}) ==`);

    const core = state.enemies.find(e => e.kind === 'core');
    check(!!core, 'the core is there');
    check(player.weapon === 'cornerstone' && getWeapon(player.weapon).ammo == null,
      `arrives able to finish it (${player.weapon}, ${player.ammo} triangles)`);

    if (core) {
      check(core.restoreHits === 12, `twelve faces to put back (${core.restoreHits})`);
      // nothing can hurt it
      const wasWeapon = player.weapon;
      player.weapon = 'drill';
      swingAt(core, 3);
      check(core.alive && !core.restored && core.restoreHits === 12,
        'no weapon in the game can damage it');
      player.weapon = wasWeapon;

      // the core never moves, whatever it's doing to the room
      const x0 = core.x, y0 = core.y;
      tick(700);
      check(core.x === x0 && core.y === y0, 'it never moves');

      // twelve triangles put it back
      player.ammo = 40;
      fireAt(core, 12);
      check(core.restored, `twelve triangles restore it (hits left ${core.restoreHits})`);
      tick(4);
      check(core.x === x0, 'and it stays where it is rather than fleeing');

      // ...which ends the game
      lv7.cutscenes.push({ id: 'l7-ending', when: { bossDefeated: true } });
      tick(3);
      check(isCutsceneActive() && activeCutsceneId() === 'l7-ending',
        `restoring it starts the ending (active: ${activeCutsceneId()})`);
      skipCutscene();
      tick(3);
      check(state.gameState === 'win', `and the ending wins the game (gameState: ${state.gameState})`);
    }

    // --- a new run tells the story again ---
    //
    // `once: true` means once per playthrough, not once per browser. Nothing
    // called resetNarrative() for a long time, so a player who had seen
    // level 2's opening once never saw it again on any later run — reported
    // from play as "the dialogue with Quarrick is gone".
    out.push('== a new run replays the story ==');
    {
      markCutsceneSeen('l2-arrival');
      check(hasSeenCutscene('l2-arrival'), 'a scene can be marked seen');
      // The title-screen path: switchTo with no data is a brand new run.
      switchTo('playing');
      check(!hasSeenCutscene('l2-arrival'), 'starting a new run clears it again');

      // ...and a game-over retry must NOT, because dying shouldn't un-see one.
      markCutsceneSeen('l2-arrival');
      switchTo('playing', { retry: true });
      check(hasSeenCutscene('l2-arrival'), 'a retry after dying leaves it seen');
    }

    // --- nobody is standing inside the scenery ---
    //
    // Every scene that puts a character on the ground used to pass
    // `level.groundY`, which stopped meaning "the floor" when ground became
    // terraced. Level 2's opening put Quarrick 120px inside the quarry rim
    // and the player talked to the top of his head. Reported from play, not
    // by any probe, which is why this one exists.
    out.push('== characters stand on the ground ==');
    for (let i = 0; i < levels.length; i++) {
      // Fresh story position per level, or the `once: true` openings won't
      // play at all — the test above deliberately leaves one marked seen.
      resetNarrative();
      state.currentLevelIndex = i;
      switchTo('playing', { retry: true });
      const lv = getLevel();
      state.lives = 999;
      player.invincible = 999999;
      // Let whatever the level opens with get as far as placing people.
      tick(90);
      const npc = state.rescueNPC;
      if (!npc) { out.push(`  ok   level ${i + 1}: no one placed at the start`); continue; }
      const feet = npc.y + npc.height;
      const surface = surfaceYAt(npc.x);
      const buried = feet - surface;
      // Positive = below the floor. A couple of px of slack for rounding.
      if (buried > 3) {
        fails++;
        out.push(`  FAIL level ${i + 1}: ${'Quarrick'} is ${Math.round(buried)}px inside the ground (feet ${Math.round(feet)}, surface ${surface})`);
      } else {
        out.push(`  ok   level ${i + 1}: placed on the surface (feet ${Math.round(feet)}, surface ${surface})`);
      }
    }

    // --- nobody is standing inside anybody ---
    //
    // Reported from play: "beginning of the level cutscenes with Quarrick
    // have enemies in him." Every scene places him at a fixed offset from
    // the player, which is a spot chosen by where the player stopped rather
    // than by what is already standing there.
    out.push('== characters have room to stand ==');
    for (let i = 0; i < levels.length; i++) {
      resetNarrative();
      state.currentLevelIndex = i;
      switchTo('playing', { retry: true });
      state.lives = 999;
      player.invincible = 999999;
      tick(90);
      const npc = state.rescueNPC;
      if (!npc) { out.push(`  ok   level ${i + 1}: no one placed at the start`); continue; }
      const inside = state.enemies.filter(e => e.alive && !e.restored &&
        npc.x < e.x + e.w && npc.x + npc.width > e.x &&
        npc.y < e.y + e.w && npc.y + npc.height > e.y);
      check(inside.length === 0,
        `level ${i + 1}: nothing is standing inside Quarrick at x${Math.round(npc.x)}` +
        (inside.length ? ` — ${inside.map(e => Math.round(e.x)).join(', ')}` : ''));
    }

    out.push(fails ? `*** ${fails} FAILURE(S)` : 'PASS the story beats hold together');
    out.push('errors: ' + (window.__errs.length ? window.__errs.join(' | ') : 'none'));
    document.getElementById('out').textContent = out.join('\n');
  }, 250);
</script></body></html>
