<!DOCTYPE html>
<!-- Measures exactly how far past a ledge (horizontally and vertically) the
     player can be when a coyote-time jump still fires — i.e. how "clearly
     over the pit" a late jump press can look before P.coyoteFrames expires. -->
<html><body style="margin:0;background:#000;">
<script>localStorage.setItem('blockbash-save', JSON.stringify({ saveVersion: 1, furthestLevelIndex: 0, bestScore: 0, hasSeenIntro: true }));</script>
<canvas id="game" width="800" height="450"></canvas><pre id="out"></pre>
<script type="module" src="../src/main.js"></script>
<script type="module">
  import { player } from '../src/entities/player.js';
  import { state } from '../src/state.js';
  import { update } from '../src/scenes/sceneManager.js';
  import { getLevel } from '../src/levels/levelLoader.js';
  import { P } from '../src/engine/physics.js';
  const key = (t, k) => document.dispatchEvent(new KeyboardEvent(t, { key: k }));
  const out = [];

  function measure(runSpeed, framesAfterLeavingGround) {
    key('keydown', ' '); key('keyup', ' ');
    const lv = getLevel();
    // find a long flat ground segment away from any hazard to run off of
    const seg = lv.platforms.find(p => p.ground && p.width > 400);
    const edgeX = seg.x + seg.width;
    // Explicit, complete reset — this runs many times in one page load (once
    // per frame value swept), so nothing can be left over from a previous
    // call's jump (isOnGround, coyoteTimer, jumpBuffer all matter
    // to whether the next jump press fires).
    player.x = edgeX - 250; player.y = lv.groundY - player.height;
    player.velocityX = 0; player.velocityY = 0; player.invincible = 99999;
    player.isOnGround = true; player.wasOnGround = true;
    player.coyoteTimer = 0; player.jumpBuffer = 0;
    state.enemies.forEach(e => e.alive = false);
    if (runSpeed) key('keydown', 'Shift');
    key('keydown', 'ArrowRight');
    let leftGroundX = null, leftGroundY = null;
    for (let i = 0; i < 400 && player.isOnGround; i++) update();
    if (player.isOnGround) throw new Error('never left the ground — runway too short');
    leftGroundX = player.x; leftGroundY = player.y;
    // now run the requested number of ADDITIONAL frames while airborne
    for (let i = 0; i < framesAfterLeavingGround; i++) update();
    key('keyup', 'ArrowRight'); if (runSpeed) key('keyup', 'Shift');
    const beforeX = player.x, beforeY = player.y;
    key('keydown', ' ');
    update();
    key('keyup', ' ');
    const jumped = player.velocityY < 0;
    return {
      edgeX, leftGroundX, leftGroundY, groundY: lv.groundY,
      pressX: beforeX, pressY: beforeY, jumped,
      pastEdgeX: beforeX - edgeX, belowSurfaceY: beforeY - (lv.groundY - player.height)
    };
  }

  setTimeout(() => {
    out.push('P.coyoteFrames = ' + P.coyoteFrames);
    for (const runSpeed of [false, true]) {
      out.push(`\n=== ${runSpeed ? 'RUN' : 'WALK'} speed ===`);
      let lastJumpFrame = null;
      for (let f = 0; f <= P.coyoteFrames + 1; f++) {
        const r = measure(runSpeed, f);
        out.push(`${f} frames after leaving ground: pastEdge=${Math.round(r.pastEdgeX)}px belowSurface=${Math.round(r.belowSurfaceY)}px jumped=${r.jumped}`);
        if (r.jumped) lastJumpFrame = f;
      }
      out.push(`  latest frame a jump still fired: ${lastJumpFrame}`);
    }
    document.getElementById('out').textContent = out.join('\n');
  }, 200);
</script></body></html>
