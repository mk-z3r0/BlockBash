<!DOCTYPE html>
<html><body style="margin:0;background:#000;">
<script>
  localStorage.setItem('blockbash-save', JSON.stringify({
    saveVersion: 1, furthestLevelIndex: 0, bestScore: 0, hasSeenIntro: true
  }));
</script>
<canvas id="game" width="800" height="450"></canvas><pre id="out"></pre>
<script>window.__errs=[];window.addEventListener('error',e=>window.__errs.push('ERR: '+(e.message||e.error)));</script>
<script type="module" src="../src/main.js"></script>
<script type="module">
  import { getCurrentName } from '../src/scenes/sceneManager.js';
  import * as audio from '../src/audio/audio.js';
  const key = (t, k) => document.dispatchEvent(new KeyboardEvent(t, { key: k }));
  const out = [];
  setTimeout(() => {
    out.push('1. boot with hasSeenIntro=true: scene=' + getCurrentName() + '  (must be title, always)');
    key('keydown', ' '); key('keyup', ' ');
    out.push('2. after pressing start: scene=' + getCurrentName() + '  (must be playing directly, intro skipped)');
    out.push('   music playing: ' + audio.isMusicPlaying() + '  (must be true)');
    out.push('errors: ' + (window.__errs.length ? window.__errs.join(' | ') : 'none'));
    document.getElementById('out').textContent = out.join('\n');
  }, 200);
</script></body></html>
