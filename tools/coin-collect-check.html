<!DOCTYPE html>
<html><body style="margin:0;background:#000;">
<script>localStorage.setItem('blockbash-save', JSON.stringify({ saveVersion: 1, furthestLevelIndex: 0, bestScore: 0, hasSeenIntro: true }));</script>
<canvas id="game" width="800" height="450"></canvas><pre id="out"></pre>
<script type="module" src="../src/main.js"></script>
<script type="module">
  import { player } from '../src/entities/player.js';
  import { state } from '../src/state.js';
  import { update } from '../src/scenes/sceneManager.js';
  import { getLevel } from '../src/levels/levelLoader.js';
  import { coins } from '../src/entities/coins.js';
  const key = (t, k) => document.dispatchEvent(new KeyboardEvent(t, { key: k }));
  const out = [];

  setTimeout(() => {
    key('keydown', ' '); key('keyup', ' ');
    const lv = getLevel();
    out.push('total coins: ' + coins.length);

    // walk straight through each "walkable tier" coin's x position at
    // ground level, no jumping at all, and confirm it gets collected
    const walkableX = [800, 1000, 1900, 2720, 2900, 5320, 5620, 5660, 6400, 6450, 6500];
    let collectedAtWalk = 0;
    for (const x of walkableX) {
      player.x = x - 30; player.y = lv.groundY - player.height;
      player.velocityX = 0; player.velocityY = 0; player.invincible = 999;
      state.enemies.forEach(e => e.alive = false);
      key('keydown', 'ArrowRight');
      for (let i = 0; i < 40; i++) update(); // just walk through, no jump input at all
      key('keyup', 'ArrowRight');
      const c = coins.find(c => Math.abs(c.x - x) < 1);
      if (c && c.collected) collectedAtWalk++;
      else out.push(`  MISSED at x=${x}: coin ${c ? 'found but not collected' : 'not found'}`);
    }
    out.push(`walkable-tier coins actually collected while walking (no jump): ${collectedAtWalk}/${walkableX.length}`);

    out.push('errors: none check via full sweep below');
    document.getElementById('out').textContent = out.join('\n');
  }, 200);
</script></body></html>
