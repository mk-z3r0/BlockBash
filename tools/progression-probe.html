<!DOCTYPE html>
<html><body style="margin:0;background:#000;"><canvas id="game" width="800" height="450"></canvas><pre id="out"></pre>
<script>window.__errs=[];window.addEventListener('error',e=>window.__errs.push('ERR: '+(e.message||e.error)));</script>
<script type="module" src="../src/main.js"></script>
<script type="module">
  import { player } from '../src/entities/player.js';
  import { state } from '../src/state.js';
  import { update, switchTo, getCurrentName } from '../src/scenes/sceneManager.js';
  import { getLevel } from '../src/levels/levelLoader.js';
  import { levels } from '../src/levels/registry.js';
  import level1 from '../src/levels/data/level1.js';

  const key = (t, k) => document.dispatchEvent(new KeyboardEvent(t, { key: k }));
  const out = [];
  const snap = () => `idx=${state.currentLevelIndex} score=${state.score} lives=${state.lives} scene=${getCurrentName()} state=${state.gameState}`;

  setTimeout(() => {
    // simulate a 2nd level so "advance" and "win" are actually distinguishable
    levels.push(level1);
    out.push(`registry length forced to ${levels.length} for this test`);

    // --- start a new run from the title screen ---
    key('keydown', ' '); key('keyup', ' ');
    out.push('after title->playing: ' + snap());

    // kill the boss so the goal isn't blocked, and bump score via a fake coin
    state.enemies.forEach(e => { if (e.boss) e.alive = false; });
    state.score = 42;

    // --- reach the goal at level 0: should ADVANCE, not win, score persists ---
    const lv0 = getLevel();
    player.x = lv0.goal.x; player.y = lv0.goal.y + 5; player.velocityX = 0; player.velocityY = 0;
    update();
    out.push('after reaching goal at level 0: ' + snap());

    // --- reach the goal at level 1 (now the last level): should WIN ---
    state.enemies.forEach(e => { if (e.boss) e.alive = false; });
    const lv1 = getLevel();
    player.x = lv1.goal.x; player.y = lv1.goal.y + 5; player.velocityX = 0; player.velocityY = 0;
    update();
    out.push('after reaching goal at level 1 (last): ' + snap());

    // --- from win, restart: should go back to level 0 (a fresh run) ---
    key('keydown', 'r'); key('keyup', 'r');
    out.push('after win-screen restart: ' + snap());

    // --- advance to level 1 again, die out, and retry from game-over ---
    state.enemies.forEach(e => { if (e.boss) e.alive = false; });
    state.score = 77;
    const lvA = getLevel();
    player.x = lvA.goal.x; player.y = lvA.goal.y + 5; player.velocityX = 0; player.velocityY = 0;
    update();
    out.push('advanced to level 1 again: ' + snap());

    state.lives = 1;
    player.invincible = 0;
    player.y = 10000; // fall into the void
    update();
    out.push('after fatal fall (0 lives): ' + snap());

    key('keydown', 'r'); key('keyup', 'r');
    out.push('after game-over retry: ' + snap() + '  <-- currentLevelIndex must stay 1, not reset to 0');

    out.push('errors: ' + (window.__errs.length ? window.__errs.join(' | ') : 'none'));
    document.getElementById('out').textContent = out.join('\n');
  }, 200);
</script></body></html>
