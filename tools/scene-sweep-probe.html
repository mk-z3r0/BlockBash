<!DOCTYPE html><html><body><canvas id="game" width="800" height="450"></canvas><pre id="out">running…</pre>
<script>localStorage.setItem('blockbash-save', JSON.stringify({ saveVersion: 1, furthestLevelIndex: 0, bestScore: 0, hasSeenIntro: false, narrative: { seenCutscenes: {}, npcStage: 0, flags: {} } }));window.__errs=[];window.addEventListener('error',e=>window.__errs.push('ERR: '+(e.message||e.error)));</script>
<script type="module" src="../src/main.js"></script>
<script type="module">
// The two bespoke scenes — the opening and the ending — update and draw
// every frame without throwing. A thrown draw aborts the rest of the frame
// silently: the intro's debris cloud vanished for a whole session because
// one helper the refactor moved wasn't imported, and nothing but a
// screenshot could tell. The sweep also presses nothing, so it proves both
// scenes END on their own.
import { update, draw, switchTo, getCurrentName } from '../src/scenes/sceneManager.js';
const out=[]; let bad=0;
setTimeout(()=>{
  for (const [scene,frames] of [['intro',1100],['ending',1900]]) {
    switchTo(scene);
    for(let i=0;i<frames && getCurrentName()===scene;i++){
      try { update(); } catch(e){ out.push(`${scene} update THREW f${i}: ${e.message}`); bad++; break; }
      if(i%25===0){ try { draw(); } catch(e){ out.push(`${scene} draw THREW f${i}: ${e.message}`); bad++; break; } }
    }
    out.push(`${scene}: swept, ended on scene '${getCurrentName()}'`);
  }
  out.push(bad?`*** ${bad} FAILURE(S)`:'PASS both scenes update and draw every frame without throwing');
  out.push('errors: '+(window.__errs.length?window.__errs.join(' | '):'none'));
  document.getElementById('out').textContent=out.join('\n');
},300);
</script></body></html>
