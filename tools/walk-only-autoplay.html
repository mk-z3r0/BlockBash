<!DOCTYPE html>
<html><body style="margin:0;background:#000;">
<script>localStorage.setItem('blockbash-save', JSON.stringify({ saveVersion: 1, furthestLevelIndex: 0, bestScore: 0, hasSeenIntro: true }));</script>
<canvas id="game" width="800" height="450"></canvas><pre id="out"></pre>
<script type="module" src="../src/main.js"></script>
<script type="module">
  import { player } from '../src/entities/player.js';
  import { state } from '../src/state.js';
  import { update } from '../src/scenes/sceneManager.js';
  import { getLevel } from '../src/levels/levelLoader.js';
  const key = (t, k) => document.dispatchEvent(new KeyboardEvent(t, { key: k }));
  const out = [];

  setTimeout(() => {
    key('keydown', ' '); key('keyup', ' ');
    const lv = getLevel();
    const ground = lv.platforms.filter(p => p.ground);
    const solidAt = x => ground.some(p => x >= p.x && x <= p.x + p.width);
    const spikeAt = x => lv.hazards.some(h => x >= h.x - 2 && x <= h.x + h.width + 2);

    state.lives = 99;
    state.enemies.forEach(e => { e.alive = true; });
    key('keydown', 'ArrowRight'); // NOTE: walk-only, never holding Shift
    let maxX = player.x, hold = 0, lives0 = state.lives, deaths = [], stuckCounter = 0, lastX = player.x;
    for (let i = 0; i < 15000; i++) {
      if (player.isOnGround && hold === 0) {
        const ahead = player.x + player.width + 24;
        const enemyAhead = state.enemies.some(e => e.alive && !e.boss &&
          e.x > player.x && e.x - (player.x + player.width) < 55 && Math.abs(e.y - player.y) < 40);
        // Solid blocks jumped ONTO rather than over (the staircase treads,
        // the tall wall) — solidAt() only looks at ground segments, so
        // without this the bot walks into a tread and stalls there with no
        // deaths logged, which reads as "walk can't cross this" when really
        // the bot just never tried. Same fix as gap-probe.html's.
        const wallAhead = lv.platforms.some(p => !p.ground && p.width > 1 &&
          ahead >= p.x && ahead <= p.x + p.width &&
          p.y < player.y + player.height && p.y + p.height > player.y);
        if (!solidAt(ahead) || spikeAt(ahead) || enemyAhead || wallAhead) { key('keydown', ' '); hold = 16; }
      }
      if (hold > 0 && --hold === 0) key('keyup', ' ');
      const beforeX = player.x;
      update();
      if (state.lives < lives0) { deaths.push(Math.round(beforeX)); lives0 = state.lives; }
      if (player.x > maxX) { maxX = player.x; stuckCounter = 0; } else { stuckCounter++; }
      if (state.gameState !== 'playing') break;
      if (stuckCounter > 1200) { out.push(`bot stopped making forward progress near x=${Math.round(player.x)} (stuck for 1200+ ticks, likely a wall only run can cross)`); break; }
    }
    out.push(`furthest reached: ${Math.round(maxX)} / edge ${lv.worldEdgeX}`);
    out.push(`deaths: ${deaths.length}   died near: ${deaths.length ? deaths.slice(0,15).join(', ') : 'never'}${deaths.length>15?' ...':''}`);
    out.push(`gameState: ${state.gameState}`);
    document.getElementById('out').textContent = out.join('\n');
  }, 200);
</script></body></html>
