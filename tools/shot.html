<!DOCTYPE html>
<!-- Screenshot helper. Needs the local server running.
     tools/shot.html?x=4980        - park the player at x and render
     tools/shot.html?cutscene=240  - run the boss cutscene to frame N and render -->
<html><body style="margin:0;background:#0a0d1c;"><canvas id="game" width="800" height="450"></canvas>
<script>localStorage.setItem('blockbash-save', JSON.stringify({ saveVersion: 1, furthestLevelIndex: 0, bestScore: 0, hasSeenIntro: true }));</script>
<script type="module" src="../src/main.js"></script>
<script type="module">
  import { player } from '../src/entities/player.js';
  import { state } from '../src/state.js';
  import { update } from '../src/scenes/sceneManager.js';
  import { getLevel } from '../src/levels/levelLoader.js';
  import { camera } from '../src/engine/camera.js';
  const key = (t, k) => document.dispatchEvent(new KeyboardEvent(t, { key: k }));
  const q = new URLSearchParams(location.search);

  setTimeout(() => {
    key('keydown', ' '); key('keyup', ' ');
    const lv = getLevel();

    if (q.has('cutscene')) {
      const boss = state.enemies.find(e => e.boss);
      player.x = lv.boss.wakeX - 40; player.y = lv.groundY - player.height;
      player.velocityX = 0; player.velocityY = 0;
      // see tools/cutscene-probe.html — the cutscene needs the boss fully
      // on-screen, so seed the camera as if it had already been following
      camera.x = Math.min(player.x - 800 / 2.6, lv.worldWidth - 800);
      key('keydown', 'ArrowRight');
      for (let i = 0; i < 80 && !boss.awake; i++) update();
      key('keyup', 'ArrowRight');
      for (let i = 0; i < Number(q.get('cutscene')); i++) update();
    } else {
      player.x = Number(q.get('x') || 100); player.y = 340;
      player.velocityY = 0; player.invincible = 9999;
      for (let i = 0; i < 90; i++) update();   // settle the camera
    }
  }, 150);
</script></body></html>
