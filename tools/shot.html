<!DOCTYPE html>
<html><body style="margin:0;background:#0a0d1c;">
<canvas id="game" width="800" height="450"></canvas>
<script type="module" src="../src/main.js"></script>
<script type="module">
  import { player } from '../src/entities/player.js';
  import { update } from '../src/scenes/sceneManager.js';
  const x = Number(new URLSearchParams(location.search).get('x') || 100);
  setTimeout(() => {
    document.dispatchEvent(new KeyboardEvent('keydown', { key: ' ' }));
    document.dispatchEvent(new KeyboardEvent('keyup', { key: ' ' }));
    player.x = x; player.y = 340; player.velocityY = 0; player.invincible = 9999;
    for (let i = 0; i < 90; i++) update();   // settle the camera
  }, 150);
</script>
</body></html>
