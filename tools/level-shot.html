<!DOCTYPE html>
<html><body style="margin:0;background:#0a0d1c;"><canvas id="game" width="800" height="450"></canvas>
<script>localStorage.setItem('blockbash-save', JSON.stringify({ saveVersion: 1, furthestLevelIndex: 0, bestScore: 0, hasSeenIntro: true, narrative: { seenCutscenes: {}, npcStage: 0, flags: {} } }));</script>
<script type="module" src="../src/main.js"></script>
<script type="module">
  // Screenshot any level anywhere. The one place to point a headless
  // --screenshot at while authoring, instead of a new probe page per shot.
  //
  //   ?level=N     level index (default 0)
  //   ?x=N         put the player here and settle the camera on them
  //   ?frames=N    tick this many frames first (default 40)
  //   ?keepscenes  don't strip cutscenes — for shooting a scripted moment
  import { player } from '../src/entities/player.js';
  import { state } from '../src/state.js';
  import { camera } from '../src/engine/camera.js';
  import { update, draw, switchTo } from '../src/scenes/sceneManager.js';
  import { getLevel } from '../src/levels/levelLoader.js';
  import { getWeapon } from '../src/weapons/registry.js';
  import { startCutscene, isCutsceneActive, skipCutscene } from '../src/cutscenes/runner.js';
  import { cutsceneLibrary } from '../src/cutscenes/library.js';

  const q = new URLSearchParams(location.search);
  const levelIndex = parseInt(q.get('level') || '0', 10);
  const frames = parseInt(q.get('frames') || '40', 10);

  setTimeout(() => {
    state.currentLevelIndex = levelIndex;
    switchTo('playing', { retry: true });
    const lv = getLevel();
    if (!q.has('keepscenes')) lv.cutscenes.length = 0;

    // Screenshots are about what the game LOOKS like; dying mid-shot just
    // photographs a cloud of particles.
    player.invincible = 999999;
    if (q.has('x')) {
      const x = parseFloat(q.get('x'));
      player.x = x;
      // Stand on whatever surface is actually at this x — ground is terraced
      // now, and groundY is only the level's base line.
      const seg = lv.platforms.filter(p => p.ground).find(p => x >= p.x && x <= p.x + p.width);
      player.y = (seg ? seg.y : lv.groundY) - player.height;
      player.velocityX = 0; player.velocityY = 0;
      camera.x = Math.max(0, Math.min(x - 800 / 2.6, lv.worldWidth - 800));
    }
    // ?restore=N sets the core's remaining faces, for shooting what it
    // looks like part-way through being put back together.
    if (q.has('restore')) {
      const core = state.enemies.find(e => e.kind === 'core');
      if (core) core.restoreHits = parseInt(q.get('restore'), 10);
    }
    // ?scene=id  plays a named cutscene and ticks `frames` into it, with
    // anything the level would have opened with skipped out of the way
    // first. Dialogue beats wait for a keypress, so a scene halfway through
    // a level can't be reached by ticking — the opening would still be
    // sitting there on its first line.
    if (q.has('scene')) {
      for (let i = 0; i < 6 && isCutsceneActive(); i++) { skipCutscene(); update(); }
      const def = cutsceneLibrary[q.get('scene')];
      if (def) {
        startCutscene(def, {
          player, state, level: lv, data: {},
          showToast: () => {},
          spawnExplosion: () => {},
          finishLevel: () => {}
        });
      }
    }

    for (let i = 0; i < frames; i++) update();

    // ?phase=name forces the boss into a phase, for shooting a specific
    // moment of a fight — a telegraph, an open window, a drill bound in the
    // floor — instead of ticking and hoping to catch one.
    //
    // Applied AFTER the ticks, not before: the phase machine runs every
    // frame, so a phase set up front is several phases stale by the time
    // anything is drawn. The few frames after it are what let the phase
    // populate the visual state it owns (mining, strain, posePhase), which
    // is the entire thing being photographed.
    if (q.has('phase')) {
      const boss = state.enemies.find(e => e.boss && e.mode === 'fight');
      if (boss) {
        boss.phase = q.get('phase');
        boss.phaseTimer = parseInt(q.get('phaseTimer') || '40', 10);
        // Park the player right next to it so it faces and reacts to
        // someone, and so the shot frames the fight rather than empty floor.
        if (q.has('near')) {
          player.x = boss.x - parseFloat(q.get('near'));
          player.y = boss.y + boss.w - player.height;
          camera.x = Math.max(0, Math.min(boss.x - 800 / 2, getLevel().worldWidth - 800));
        }
        for (let i = 0; i < parseInt(q.get('settle') || '3', 10); i++) update();
        boss.phase = q.get('phase');
      }
    }
    // ?weapon=id&swing=T puts a specific weapon in the player's hands and
    // freezes it T of the way through its swing (0..1). Weapon art is the
    // one thing with no probe and no way to check by playing — a swing is
    // 16-30 frames — so this is how "does the hammer look like a hammer at
    // 22px" gets answered. Set after the ticks so nothing winds it back.
    if (q.has('weapon')) {
      player.weapon = q.get('weapon');
      player.hasWeapon = true;
      player.ammo = 10;
      if (q.has('swing')) {
        const w = getWeapon(q.get('weapon'));
        const t = parseFloat(q.get('swing'));
        if (w) player.weaponTimer = Math.max(1, Math.round(w.duration * (1 - t)));
      }
      if (q.has('facing')) player.facing = parseInt(q.get('facing'), 10);
    }
    // Invincibility makes the player BLINK (entities/player.js), so half the
    // frames photograph an empty space where they're standing. Clear it just
    // before drawing — deaths all happen during update, which is over.
    player.invincible = 0;
    draw();
    document.title = `L${levelIndex} x=${Math.round(player.x)} cam=${Math.round(camera.x)}`;
  }, 250);
</script></body></html>
