<!DOCTYPE html>
<html><body style="margin:0;background:#0a0d1c;"><canvas id="game" width="800" height="450"></canvas>
<script>localStorage.setItem('blockbash-save', JSON.stringify({ saveVersion: 1, furthestLevelIndex: 0, bestScore: 0, hasSeenIntro: false, narrative: { seenCutscenes: {}, npcStage: 0, flags: {} } }));</script>
<script type="module" src="../src/main.js"></script>
<script type="module">
  // Screenshot the opening at a given frame. ?frame=N (default 646: six
  // frames after the corner blows off, when the blast is at its biggest).
  import { update, draw, switchTo } from '../src/scenes/sceneManager.js';
  const q = new URLSearchParams(location.search);
  const frame = parseInt(q.get('frame') || '646', 10);
  setTimeout(() => {
    switchTo('intro');
    for (let i = 0; i < frame; i++) update();
    draw();
    document.title = `intro f${frame}`;
  }, 250);
</script></body></html>
